<style>
  :root{
    --verde:#2e6b34; --verde-osc:#1d4a22; --verde-claro:#e8f2e9;
    --gris:#5b6168; --borde:#d8dee3; --fondo:#f4f6f5; --rojo:#b3372e; --ambar:#a06b00;
    --azul:#27567d; --tarjeta:#ffffff;

  header{background:var(--verde-osc); color:#fff; padding:14px 20px;}
  header h1{font-size:18px; font-weight:600;}
  header .sub{font-size:12px; opacity:.85; margin-top:2px;}
  .wrap{max-width:1180px; margin:0 auto; padding:14px;}
  /* tabs */
  .tabs{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 14px;}
  .tabs button{border:1px solid var(--borde); background:#fff; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:14px; color:#333;}
  .tabs button.activa{background:var(--verde); color:#fff; border-color:var(--verde);}
  .tabs button.admin{margin-left:auto; border-style:dashed; color:var(--gris);}
  .tabs button.admin.activa{background:var(--azul); color:#fff; border-color:var(--azul);}
  /* cards y grillas */
  .card{background:var(--tarjeta); border:1px solid var(--borde); border-radius:10px; padding:14px 16px; margin-bottom:14px;}
  .card h2{font-size:14px; color:var(--verde-osc); margin-bottom:10px; text-transform:uppercase; letter-spacing:.4px;}
  .card h3{font-size:13px; color:var(--gris); margin:12px 0 6px;}
  .grid{display:grid; gap:10px;}
  .g-inputs{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .g-kpi{grid-template-columns:repeat(auto-fit,minmax(165px,1fr));}
  .campo label{display:block; font-size:11.5px; color:var(--gris); margin-bottom:3px;}
  .campo input{width:100%; padding:7px 8px; border:1px solid var(--borde); border-radius:6px; font-size:14px; text-align:right;}
  .campo input:focus{outline:2px solid var(--verde-claro); border-color:var(--verde);}
  .campo .unidad{font-size:10.5px; color:#9aa1a8;}
  .kpi{background:var(--verde-claro); border-radius:8px; padding:10px 12px;}
  .kpi .et{font-size:11px; color:var(--gris);}
  .kpi .val{font-size:19px; font-weight:700; color:var(--verde-osc); margin-top:2px;}
  .kpi .val.neg{color:var(--rojo);}
  .kpi .extra{font-size:11px; color:var(--gris); margin-top:2px;}
  /* tablas */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{padding:6px 8px; border-bottom:1px solid #eceff1; text-align:right;}
  th{color:var(--gris); font-weight:600; font-size:12px;}
  th:first-child, td:first-child{text-align:left;}
  tr.total td{font-weight:700; border-top:2px solid var(--borde);}
  td.neg{color:var(--rojo);}
  td.pos{color:var(--verde);}
  .nota{font-size:11.5px; color:var(--gris); margin-top:8px; line-height:1.45;}
  .alerta{background:#fdecea; border:1px solid #f5c6c2; color:var(--rojo); padding:10px 12px; border-radius:8px; margin-bottom:14px; display:none;}
  .dos-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:860px){.dos-col{grid-template-columns:1fr;}}
  /* parametros */
  .param-grupo{margin-bottom:16px;}
  .dieta-tabla input{width:62px; padding:4px; text-align:right; border:1px solid var(--borde); border-radius:4px;}
  .dieta-tabla td,.dieta-tabla th{padding:3px 5px;}
  .badge{display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:10px; background:var(--verde-claro); color:var(--verde-osc); margin-left:6px;}
  .badge.warn{background:#fff3df; color:var(--ambar);}
  svg text{font-family:inherit;}
  footer{font-size:11px; color:#9aa1a8; text-align:center; padding:10px 0 24px;}
</style>

<script>
"use strict";
/* =====================================================================
   MOTOR DE CÁLCULO (lógica corregida según auditoría Fase 1)
   ===================================================================== */

// ---------- Parámetros base (los edita el programador en su pestaña) ----------
const ING = ["Maíz","Silo","Gluten","Rollo","Núcleo","Germen","Hominy"];

const P = {
  insumos: {
    maizPizarra: 260000,     // $/ton pizarra
    contraflete: 63181,      // $/ton
    flete90: 20942,          // $/ton (flete 90 km)
    gluten: 132000,          // $/ton
    nucleo: 409050,          // $/ton
    germen: 291921,          // $/ton
    rollo: 25000,            // $/ton
    relSilo: 0.63945,        // silo = maíz pizarra × rel
    relHominy: 0.79,         // hominy = maíz pizarra × rel + flete90/1.2
    dolar: 1450,             // $/USD (informativo)
    hoteleria: 310,          // $/cab/día
    sanidad: 7500,           // $/cab
    guias: 1725,             // $/cab
    fleteJaulaKm: 3000,      // $/km
  },
  ms:  [88, 37, 42, 87, 97.5, 98, 73.5],          // % materia seca por ingrediente
  ivaIng: [10.5, 0, 21, 0, 21, 21, 21],           // alícuota IVA por ingrediente
  impuestos: {
    ivaVentaHacienda: 10.5, ivaCompraHacienda: 10.5, ivaFletes: 21, ivaServicios: 21,
    mniRetGcias: 224000,     // RG 830 Anexo VIII — bienes de cambio (vigente 06/2026)
    alicRetGcias: 2,         // %
  },
  financiero: { tasaAnual: 19, plazoCompra: 30, plazoVenta: 30 }, // % y días
  anual: { diasEntreCiclos: 0 }, // días de corral vacío entre ciclos (limpieza/reposición)
  margenes: { markupAlim: 15, comVendedor: 2.5, margenFlete: 20, relSanidad: 1.25, pctComisionPropia: 100 },
  // Escenarios en base al % de ENGORDE (como tabla!E:F del Excel: vacas 0,32→0,34/0,30
  // equivale a ±6,25% relativo). Los deltas de precios quedan disponibles, en 0 por defecto.
  escenarios: {
    optimista: { dEngorde: 6.25,  dVenta: 0, dCompra: 0, dRacion: 0 },
    pesimista: { dEngorde: -6.25, dVenta: 0, dCompra: 0, dRacion: 0 },
  },
  // tablas de consumo MS / peso vivo (de hoja "tabla")
  tablaVacas:  [[0,380,0.0293],[380,750,0.0273]],
  tablaMachos: [[0,80,0.030888],[80,100,0.0311456],[100,150,0.0291310],[150,200,0.0275],[200,250,0.0286190],[250,300,0.0306],[300,350,0.0269],[350,750,0.0245]],
  // % de engorde por rango de peso de INGRESO (hoja "tabla", Tabla de nico Engordes)
  // ADG = promedio(peso in, peso out) × % engorde / 100  (= tabla!F38:F40 del Excel)
  tablaEngorde: {
    vaca:   [[0,750,0.32]],
    macho:  [[40,250,0.39],[250,350,0.37],[350,750,0.34]],
    hembra: [[40,250,0.38],[250,750,0.38]],
  },
};

// ---------- Parámetros por categoría (programador) ----------
const CATS = {
  vacas: {
    nombre:"Vacas", tabla:"tablaVacas", engorde:"vaca", lookupEtapa1:"inicio",
    adg:1.76, mortMensual:0.20, comCompra:3, comVenta:3, desbCompra:0, desbVenta:0, decomiso:0.66,
    kgJaulaCompra:13950, kgJaulaVenta:19000, cargoFijoFlete:11000, dias1:5, dias2max:30,
    dieta:[ [50,50,0,0,0,0,0], [32,21,31,0,4,12,0], [33,20,31,0,4,12,0] ],
    cliente:{ kgIn:500, kgOut:600, precioCompra:3151.20, precioCarne:7000, rinde:53, kmIn:150, kmOut:640 },
    objetivo:{ total:0, cabezas:100 },
  },
  vacaCorta: { // ADG fijo: siempre 1 kg/día indiferente al kilaje (engorde:null)
    nombre:"Vaca corta 30 días", tabla:"tablaVacas", engorde:null, lookupEtapa1:"inicio",
    adg:1.0, mortMensual:0.20, comCompra:3, comVenta:3, desbCompra:0, desbVenta:8, decomiso:0.66,
    kgJaulaCompra:13940, kgJaulaVenta:19000, cargoFijoFlete:11000, dias1:5, dias2max:30,
    dieta:[ [50,50,0,0,0,0,0], [32,21,31,0,4,12,0], [33,20,31,0,4,12,0] ],
    cliente:{ kgIn:450, kgOut:600, precioCompra:3400, precioCarne:6850, rinde:52.5, kmIn:1, kmOut:640 },
    objetivo:{ total:0, cabezas:100 },
  },
  terneros: {
    nombre:"Terneros / Novillos", tabla:"tablaMachos", engorde:"macho", lookupEtapa1:"medio",
    adg:1.48, mortMensual:0.15, comCompra:3, comVenta:3, desbCompra:0, desbVenta:0, decomiso:0,
    kgJaulaCompra:12000, kgJaulaVenta:19000, cargoFijoFlete:0, dias1:10, dias2max:60,
    dieta:[ [37,20,31,0,4,8,0], [35,22,31,0,4,8,0], [36,22,30,0,4,8,0] ],
    cliente:{ kgIn:300, kgOut:500, precioCompra:4819.72, precioCarne:8000, rinde:56, kmIn:150, kmOut:640 },
    objetivo:{ total:0, cabezas:100 },
  },
  terneras: {
    nombre:"Terneras / Vaquillonas", tabla:"tablaMachos", engorde:"hembra", lookupEtapa1:"medio",
    adg:1.349, mortMensual:0.41, comCompra:0, comVenta:3, desbCompra:0, desbVenta:0, decomiso:0,
    kgJaulaCompra:12000, kgJaulaVenta:19000, cargoFijoFlete:11000, dias1:10, dias2max:60,
    dieta:[ [38,23,26,0,4,9,0], [37,21,30,0,4,8,0], [37,21,30,0,4,8,0] ],
    cliente:{ kgIn:250, kgOut:460, precioCarne:7700, precioCompra:4862.26, rinde:55.5, kmIn:0, kmOut:400 },
    objetivo:{ total:0, cabezas:100 },
  },
};

// ---------- Precios derivados de insumos ($/ton) ----------
function preciosIngredientes(ins, dRacionPct){
  const f = 1 + (dRacionPct||0)/100;
  const maizPuesto = ins.maizPizarra - ins.contraflete + ins.flete90;
  const silo   = ins.maizPizarra * ins.relSilo;
  const hominy = ins.maizPizarra * ins.relHominy + ins.flete90/1.2;
  return [maizPuesto, silo, ins.gluten, ins.rollo, ins.nucleo, ins.germen, hominy].map(p=>p*f);
}

function lookupConsumoMS(peso, tabla){
  for (const [lo,hi,v] of tabla) if (peso>=lo && peso<hi) return v;
  return tabla[tabla.length-1][2];
}

// ---------- Cálculo completo de una categoría ----------
// deltas = {dVenta, dCompra, dRacion} en %
function calcular(cat, deltas){
  const d = deltas||{dVenta:0,dCompra:0,dRacion:0};
  const c = cat.cliente, ins = P.insumos, imp = P.impuestos;
  const rinde = c.rinde/100;
  // ADG: derivado del % de engorde según peso de ingreso (= tabla!F38:F40 del Excel),
  // salvo categorías con ADG fijo (vaca corta: 1 kg/día).
  let pctEngorde = null, adg;
  if (cat.engorde){
    pctEngorde = lookupConsumoMS(c.kgIn, P.tablaEngorde[cat.engorde]) * (1+(d.dEngorde||0)/100);
    adg = (c.kgIn+c.kgOut)/2 * pctEngorde/100;
  } else adg = cat.adg * (1+(d.dEngorde||0)/100);
  const precioCompra = c.precioCompra*(1+d.dCompra/100);
  const precioCarne  = c.precioCarne*(1+d.dVenta/100);
  const kgProd = c.kgOut - c.kgIn;
  if (kgProd<=0 || adg<=0 || rinde<=0 || cat.kgJaulaCompra<=0 || cat.kgJaulaVenta<=0) return {error:"Revisá: peso salida > peso entrada, aumento diario, rinde y kg/jaula deben ser > 0."};
  const dias = kgProd/adg;

  // --- etapas de dieta ---
  const dias1 = Math.min(cat.dias1, dias);
  const dias2 = Math.max(0, Math.min(cat.dias2max, dias-dias1));
  const dias3 = Math.max(0, dias-dias1-dias2);
  const dEtapa = [dias1,dias2,dias3];
  const w0=c.kgIn, w1=w0+dias1*adg, w2=w1+dias2*adg, w3=c.kgOut;
  const wAvg = [(w0+w1)/2,(w1+w2)/2,(w2+w3)/2];
  // pesos de lookup de consumo MS, replicando el Excel:
  // vacas/vaca corta: peso inicio etapa1, fin etapa2, salida — terneros/as: punto medio etapa1, fin etapa2, salida
  const wLook = [cat.lookupEtapa1==="medio" ? (w0+w1)/2 : w0, w2, w3];
  const precios = preciosIngredientes(ins, d.dRacion);
  const tablaMS = P[cat.tabla];
  let tcTotal=0, costoAlimBase=0, msPonderNum=0, ivaPonderNum=0, costoTotalTC=0;
  const etapas=[];
  for (let e=0;e<3;e++){
    const comp = cat.dieta[e];
    const sumComp = comp.reduce((a,b)=>a+b,0);
    const msEtapa = comp.reduce((a,ci,i)=>a+ci*P.ms[i],0)/100;            // % MS de la ración
    const costoTon = comp.reduce((a,ci,i)=>a+ci*precios[i],0)/100;        // $/ton TC
    const ivaTon   = comp.reduce((a,ci,i)=>a+ci*precios[i]*P.ivaIng[i]/100,0)/100; // $ IVA por ton
    const consMSPV = lookupConsumoMS(wLook[e], tablaMS);                   // kg MS / kg PV
    const consTCPV = msEtapa>0 ? consMSPV/(msEtapa/100) : 0;               // kg TC / kg PV
    const kgDia = wAvg[e]*consTCPV;
    const tons = kgDia*dEtapa[e]/1000;
    tcTotal += tons*1000;
    costoAlimBase += tons*costoTon;
    costoTotalTC += tons*costoTon;
    msPonderNum += msEtapa*tons;
    ivaPonderNum += tons*ivaTon;
    etapas.push({dias:dEtapa[e], kgDia, tons, costoTon, msEtapa, sumComp});
  }
  const markup = P.margenes.markupAlim/100;
  const costoAlim = costoAlimBase*(1+markup);          // a precio de transferencia (lo paga ganadería)
  const margenAlim = costoAlimBase*markup;             // queda en el feedlot propio
  const ivaTasaAlim = costoAlimBase>0 ? ivaPonderNum/costoAlimBase : 0;   // tasa efectiva s/ costo base

  // --- compra ---
  const fleteCompraKg = (c.kmIn*ins.fleteJaulaKm + cat.cargoFijoFlete)/cat.kgJaulaCompra;
  const gastosCompraKg = precioCompra*(cat.comCompra/100) + fleteCompraKg + precioCompra*(cat.desbCompra/100);
  const compraNetaKg = precioCompra + gastosCompraKg;
  const compraTotal = compraNetaKg*c.kgIn;

  // --- venta ---
  const precioVivo = precioCarne*rinde;
  const kgVendidos = c.kgOut*(1-cat.desbVenta/100);
  const fleteVentaKg = (c.kmOut*ins.fleteJaulaKm)/cat.kgJaulaVenta;
  const gastosVentaKg = precioVivo*(cat.comVenta/100) + fleteVentaKg + ins.guias/Math.max(kgVendidos,1) + precioVivo*(cat.decomiso/100);
  const ventaNetaKg = precioVivo - gastosVentaKg;
  const ventaTotal = ventaNetaKg*kgVendidos;

  // --- costos productivos ---
  const hoteleria = dias*ins.hoteleria;
  const sanidad = ins.sanidad;
  const costosProd = costoAlim + hoteleria + sanidad;

  // --- mortandad: % mensual prorrateado por días; kg al precio promedio compra/venta
  //     (misma convención que Excel vacas: I7, J7, K7) ---
  const mortCiclo = cat.mortMensual/100/30*dias;
  const kgMuertos = (c.kgIn+c.kgOut)/2*mortCiclo;
  const precioPromKg = (ventaNetaKg+compraNetaKg)/2;
  const mortandad = kgMuertos*precioPromKg;

  // --- resultado económico ---
  const resultado = ventaTotal - compraTotal - mortandad - costosProd;
  const resultadoComercial = c.kgIn*(ventaNetaKg-compraNetaKg);
  const resultadoProductivo = resultado - resultadoComercial;

  // --- impuestos ---
  const retGcias = Math.max(0, ventaTotal-imp.mniRetGcias)*imp.alicRetGcias/100;
  const ivaDF = (precioVivo*kgVendidos)*imp.ivaVentaHacienda/100;
  const ivaCF = (precioVivo*kgVendidos*(cat.comVenta/100))*imp.ivaVentaHacienda/100
              + (precioCompra*(1+cat.comCompra/100)*c.kgIn)*imp.ivaCompraHacienda/100
              + (fleteCompraKg*c.kgIn + fleteVentaKg*c.kgOut)*imp.ivaFletes/100
              + costoAlimBase*ivaTasaAlim
              + (hoteleria+sanidad)*imp.ivaServicios/100;
  const ivaPosicion = ivaDF - ivaCF; // >0 a pagar, <0 a favor

  // --- financiero ---
  const fin = P.financiero;
  const diasFin = Math.max(0, dias - fin.plazoCompra + fin.plazoVenta);
  const costoFin = fin.tasaAnual/100/365*diasFin*(compraTotal+costosProd);
  const resultadoConCF = resultado - costoFin;

  // --- indicadores ---
  const retornoCompra = compraTotal>0 ? resultado/compraTotal : 0;
  const retornoTotal = (compraTotal+costosProd)>0 ? resultado/(compraTotal+costosProd) : 0;
  const tem = Math.pow(1+retornoTotal, 30/dias)-1;
  const tea = Math.pow(1+retornoTotal, 365/dias)-1;
  const costoKgProd = costosProd/kgProd;

  // --- vuelta del año: ciclos por corral y rentabilidad anual ---
  const ciclosAno = 365/(dias + (P.anual ? P.anual.diasEntreCiclos : 0));
  const capitalCab = compraTotal + costosProd;
  const resultadoAnualCab = resultado * ciclosAno;          // $/cabeza-lugar por año
  const rentAnualSimple = retornoTotal * ciclosAno;         // retorno por ciclo × ciclos
  const rentAnualCompuesta = Math.pow(1+retornoTotal, ciclosAno) - 1; // reinvirtiendo

  // --- valores de indiferencia (aprox, mortandad al valor base) ---
  const fVenta = 1 - cat.comVenta/100 - cat.decomiso/100;
  const pvIndVivo = ((compraTotal+costosProd+mortandad)/kgVendidos + fleteVentaKg + ins.guias/kgVendidos)/fVenta;
  const pvIndCarne = pvIndVivo/rinde;
  const pcInd = ((ventaTotal-costosProd-mortandad)/c.kgIn - fleteCompraKg)/(1+cat.comCompra/100+cat.desbCompra/100);
  const racionInd = tcTotal>0 ? (ventaTotal-compraTotal-mortandad-hoteleria-sanidad)/(tcTotal/1000) : 0; // $/ton TC

  // --- apertura de márgenes: hacienda propia, 100% comisionada (ajustable) ---
  const pct = P.margenes.pctComisionPropia/100;
  const mComVenta  = c.kgOut*precioVivo*(cat.comVenta/100)*pct;
  const mComCompra = c.kgIn*precioCompra*(cat.comCompra/100)*pct;
  const mComVendedor = c.kgIn*precioCompra*(P.margenes.comVendedor/100)*pct;
  const mHoteleria = hoteleria;
  const mSanidad = sanidad/P.margenes.relSanidad*(P.margenes.relSanidad-1);
  const mFletes = (fleteCompraKg*c.kgIn + fleteVentaKg*c.kgOut)*(P.margenes.margenFlete/100);
  const consolidado = resultado + mComVenta + mComCompra + mComVendedor + margenAlim + mHoteleria + mSanidad + mFletes;

  return {
    adg, pctEngorde,
    dias, kgProd, etapas, tcTotal, conversionTC: tcTotal/kgProd,
    msPonder: tcTotal>0 ? msPonderNum/(tcTotal/1000) : 0,
    precioCompra, precioCarne, precioVivo, compraNetaKg, ventaNetaKg, kgVendidos,
    fleteCompraKg, fleteVentaKg, gastosCompraKg, gastosVentaKg,
    ventaTotal, compraTotal, mortandad, mortCiclo, costoAlim, costoAlimBase, margenAlim, hoteleria, sanidad, costosProd,
    resultado, resultadoComercial, resultadoProductivo,
    retGcias, ivaPosicion, ivaDF, ivaCF, costoFin, diasFin, resultadoConCF,
    retornoCompra, retornoTotal, tem, tea, costoKgProd,
    ciclosAno, capitalCab, resultadoAnualCab, rentAnualSimple, rentAnualCompuesta,
    pvIndCarne, pvIndVivo, pcInd, racionInd,
    mComVenta, mComCompra, mComVendedor, mHoteleria, mSanidad, mFletes, consolidado,
  };
}

// ---------- Indiferencias para un resultado objetivo por cabeza ----------
// El modelo es lineal en cada precio: se resuelve exacto con dos evaluaciones.
const Z0 = {dVenta:0,dCompra:0,dRacion:0,dEngorde:0};
function indiferenciasObjetivo(cat, objetivoCab){
  const solve = (g, x0, x1)=>{
    const y0=g(x0), y1=g(x1);
    const m=(y1-y0)/(x1-x0);
    return m===0 ? NaN : x0+(objetivoCab-y0)/m;
  };
  const conCliente = (campo, x)=>{
    const c2=JSON.parse(JSON.stringify(cat));
    c2.cliente[campo]=x;
    return calcular(c2, Z0).resultado;
  };
  const conMaiz = (x)=>{
    const old=P.insumos.maizPizarra;
    P.insumos.maizPizarra=x;
    const r=calcular(cat, Z0).resultado;
    P.insumos.maizPizarra=old;
    return r;
  };
  return {
    pvCarne: solve(x=>conCliente("precioCarne",x), cat.cliente.precioCarne, cat.cliente.precioCarne*1.1),
    pCompra: solve(x=>conCliente("precioCompra",x), cat.cliente.precioCompra, cat.cliente.precioCompra*1.1),
    maiz:    solve(conMaiz, P.insumos.maizPizarra, P.insumos.maizPizarra*1.1),
  };
}

// Indiferencias (resultado=0) bajo un escenario dado (con su % de engorde, etc.)
function indiferenciasEscenario(cat, esc, objetivoCab){
  const tgt = objetivoCab||0;
  const solve = (g, x0, x1)=>{ const y0=g(x0), y1=g(x1), m=(y1-y0)/(x1-x0); return m===0?NaN:x0+(tgt-y0)/m; };
  const conCliente = (campo, x)=>{ const c2=JSON.parse(JSON.stringify(cat)); c2.cliente[campo]=x; return calcular(c2, esc).resultado; };
  const conMaiz = (x)=>{ const old=P.insumos.maizPizarra; P.insumos.maizPizarra=x; const r=calcular(cat, esc).resultado; P.insumos.maizPizarra=old; return r; };
  return {
    pvCarne: solve(x=>conCliente("precioCarne",x), cat.cliente.precioCarne, cat.cliente.precioCarne*1.1),
    pCompra: solve(x=>conCliente("precioCompra",x), cat.cliente.precioCompra, cat.cliente.precioCompra*1.1),
    maiz:    solve(conMaiz, P.insumos.maizPizarra, P.insumos.maizPizarra*1.1),
  };
}

/* =====================================================================

   ===================================================================== */
const fmt0 = new Intl.NumberFormat("es-AR",{maximumFractionDigits:0});
const fmt1 = new Intl.NumberFormat("es-AR",{minimumFractionDigits:1, maximumFractionDigits:1});
const fmt2 = new Intl.NumberFormat("es-AR",{minimumFractionDigits:2, maximumFractionDigits:2});
const $ar = v => "$ " + fmt0.format(Math.round(v));
const $ar2 = v => "$ " + fmt2.format(v);
const pct1 = v => fmt1.format(v*100).replace(".",",") + " %";
function parseNum(s){
  if (typeof s==="number") return s;
  s = String(s).trim().replace(/\./g,"").replace(",",".");
  const v = parseFloat(s); return isNaN(v)?0:v;
}

function inputCampo(label, unidad, valor, onchange, dec){
  const id = "in_"+Math.random().toString(36).slice(2,8);
  const div = document.createElement("div"); div.className="campo";
  div.innerHTML = `<label>${label} <span class="unidad">${unidad||""}</span></label>
    <input id="${id}" type="text" inputmode="decimal" value="${(dec?fmt2:fmt0).format(valor).replace(/ /g,"")}">`;
  setTimeout(()=>{
    const inp = document.getElementById(id);
    inp.addEventListener("input", ()=>{ onchange(parseNum(inp.value)); recalcular(); });
  },0);
  return div;
}

function fila(et, val, cls){ return `<tr><td>${et}</td><td class="${cls||""}">${val}</td></tr>`; }

// ---- gráfico SVG de barras (escenarios) ----
function svgEscenarios(datos, fmtVal){ // [{nombre, valor, color}]
  const F = fmtVal || $ar;
  const W=560, H=240, padL=10, padB=26, padT=18;
  const vals = datos.map(d=>d.valor);
  const maxV = Math.max(0,...vals), minV = Math.min(0,...vals);
  const span = (maxV-minV)||1;
  const y = v => padT + (maxV-v)/span*(H-padT-padB);
  const bw = 110, gap = (W-padL*2-bw*datos.length)/(datos.length+1);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Resultado por escenario">`;
  s += `<line x1="0" y1="${y(0)}" x2="${W}" y2="${y(0)}" stroke="#c4cbd1" stroke-width="1"/>`;
  datos.forEach((d,i)=>{
    const x = padL+gap+(bw+gap)*i;
    const y0=y(Math.max(0,d.valor)), h=Math.abs(y(d.valor)-y(0));
    s += `<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(h,1)}" rx="5" fill="${d.color}"/>`;
    const yl = d.valor>=0 ? y0-6 : y0+h+14;
    s += `<text x="${x+bw/2}" y="${yl}" text-anchor="middle" font-size="13" font-weight="700" fill="#22272b">${F(d.valor)}</text>`;
    s += `<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#5b6168">${d.nombre}</text>`;
  });
  return s+"</svg>";
}

// ---- gráfico SVG apilado: composición venta vs costos ----
function svgComposicion(r){
  const items = [
    ["Compra", r.compraTotal, "#27567d"],
    ["Alimentación", r.costoAlim, "#a06b00"],
    ["Hotelería", r.hoteleria, "#7a8a4d"],
    ["Sanidad", r.sanidad, "#8d6e63"],
    ["Mortandad", r.mortandad, "#b3372e"],
  ];
  if (r.resultado>=0) items.push(["Resultado", r.resultado, "#2e6b34"]);
  const total = r.ventaTotal||1;
  const W=560, BH=34, H=120;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Composición de la venta">`;
  s += `<text x="0" y="14" font-size="12" fill="#5b6168">Venta neta ${$ar(r.ventaTotal)} = costos + resultado ${r.resultado<0?"(resultado negativo)":""}</text>`;
  let x=0;
  for (const [nom,val,col] of items){
    const w = Math.max(0, val/total*W);
    s += `<rect x="${x}" y="24" width="${w}" height="${BH}" fill="${col}"/>`;
    x+=w;
  }
  // leyenda
  let lx=0, ly=80;
  for (const [nom,val,col] of items){
    s += `<rect x="${lx}" y="${ly-9}" width="10" height="10" fill="${col}" rx="2"/>`;
    s += `<text x="${lx+14}" y="${ly}" font-size="11" fill="#22272b">${nom} ${fmt1.format(val/total*100)}%</text>`;
    lx += 14 + 8*(nom.length+6) ;
    if (lx>W-120){ lx=0; ly+=18; }
  }
  return s+"</svg>";
}

function recalcular(){
  const alerta = document.getElementById("alerta");
  if (vista!=="cat"){ alerta.style.display="none"; return; }
  const cat = CATS[catActiva];
  const out = document.getElementById("resultados");
  if (!out) return;

  const base = calcular(cat, {dVenta:0,dCompra:0,dRacion:0});
  if (base.error){ alerta.textContent = base.error; alerta.style.display="block"; out.innerHTML=""; return; }
  alerta.style.display="none";
  const opt = calcular(cat, P.escenarios.optimista);
  const pes = calcular(cat, P.escenarios.pesimista);

  const sumaDietaOk = base.etapas.every(e=>Math.abs(e.sumComp-100)<0.01);

  let h = "";
  // KPIs
  h += `<div class="card"><h2>Resultados — escenario base</h2><div class="grid g-kpi">`;
  const kpi = (et,val,extra,neg)=>`<div class="kpi"><div class="et">${et}</div><div class="val ${neg?"neg":""}">${val}</div>${extra?`<div class="extra">${extra}</div>`:""}</div>`;
  h += kpi("Resultado económico / cab", $ar(base.resultado), $ar(base.resultado/base.kgProd)+" por kg producido", base.resultado<0);
  h += kpi("Días de engorde", fmt0.format(Math.round(base.dias)),
    fmt1.format(base.kgProd)+" kg a producir · ADG "+fmt2.format(base.adg)+" kg/día"+(base.pctEngorde!==null?" (engorde "+fmt1.format(base.pctEngorde*100)+"%)":" (fijo)"));
  h += kpi("Retorno s/ capital total", pct1(base.retornoTotal), "TEA "+pct1(base.tea)+" · TEM "+pct1(base.tem), base.retornoTotal<0);
  h += kpi("Costo producción / kg", $ar(base.costoKgProd), "Conversión "+fmt1.format(base.conversionTC)+" kg TC/kg");
  h += kpi("Resultado c/ costo financiero", $ar(base.resultadoConCF), "CF "+$ar(base.costoFin)+" ("+fmt0.format(base.diasFin)+" días financiados)", base.resultadoConCF<0);
  h += kpi("Consolidado hacienda propia", $ar(base.consolidado), "incluye comisiones y márgenes propios", base.consolidado<0);
  h += kpi("Vuelta del año: "+fmt1.format(base.ciclosAno)+" ciclos", pct1(base.rentAnualSimple)+" anual",
    $ar(base.resultadoAnualCab)+" /cab-lugar/año · compuesta "+pct1(base.rentAnualCompuesta), base.rentAnualSimple<0);
  h += `</div></div>`;

  // dos columnas: desglose + indiferencia/impuestos
  h += `<div class="dos-col">`;
  h += `<div class="card"><h2>Desglose por cabeza</h2><table>`;
  h += fila("Venta neta ("+fmt1.format(base.kgVendidos)+" kg × "+$ar2(base.ventaNetaKg)+")", $ar(base.ventaTotal));
  h += fila("Compra neta ("+fmt0.format(cat.cliente.kgIn)+" kg × "+$ar2(base.compraNetaKg)+")", "− "+$ar(base.compraTotal), "neg");
  h += fila("Mortandad ("+fmt2.format(base.mortCiclo*100).replace(".",",")+" % del ciclo)", "− "+$ar(base.mortandad), "neg");
  h += fila("Alimentación ("+fmt0.format(base.tcTotal)+" kg TC, c/markup "+fmt0.format(P.margenes.markupAlim)+"%)", "− "+$ar(base.costoAlim), "neg");
  h += fila("Hotelería ("+fmt0.format(Math.round(base.dias))+" días × "+$ar(P.insumos.hoteleria)+")", "− "+$ar(base.hoteleria), "neg");
  h += fila("Sanidad", "− "+$ar(base.sanidad), "neg");
  h += `<tr class="total"><td>Resultado económico</td><td class="${base.resultado<0?"neg":"pos"}">${$ar(base.resultado)}</td></tr>`;
  h += fila("&nbsp;&nbsp;Resultado comercial (spread compra-venta)", $ar(base.resultadoComercial));
  h += fila("&nbsp;&nbsp;Resultado productivo", $ar(base.resultadoProductivo));
  h += fila("Costo financiero ("+fmt1.format(P.financiero.tasaAnual)+"% TNA, "+fmt0.format(base.diasFin)+" días)", "− "+$ar(base.costoFin), "neg");
  h += `<tr class="total"><td>Resultado con costo financiero</td><td class="${base.resultadoConCF<0?"neg":"pos"}">${$ar(base.resultadoConCF)}</td></tr>`;
  h += `</table>
    <h3>Impuestos (informativo, no incluido arriba)</h3><table>`;
  h += fila("Retención ganancias (a cuenta, RG 830)", "− "+$ar(base.retGcias), "neg");
  h += fila("Posición IVA del ciclo ("+(base.ivaPosicion>=0?"a pagar":"a favor")+")", $ar(Math.abs(base.ivaPosicion)), base.ivaPosicion>=0?"neg":"pos");
  h += `</table></div>`;

  const ind0 = indiferenciasObjetivo(cat, 0);
  h += `<div class="card"><h2>Valores de indiferencia (resultado = 0)</h2><table>
    <tr><th></th><th>Indiferencia</th><th>Actual</th><th>Margen</th></tr>`;
  const filaInd = (et, ind, act, inv)=>{
    const m = (act-ind)/ind*(inv?-1:1);
    return `<tr><td>${et}</td><td>${$ar(ind)}</td><td>${$ar(act)}</td><td class="${m<0?"neg":"pos"}">${pct1(m)}</td></tr>`;
  };
  h += filaInd("Precio venta carne ($/kg)", ind0.pvCarne, base.precioCarne);
  h += filaInd("Precio compra ($/kg vivo)", ind0.pCompra, base.precioCompra, true);
  h += filaInd("Maíz pizarra ($/ton)", ind0.maiz, P.insumos.maizPizarra, true);
  const _racBase = base.costoAlimBase/(base.tcTotal/1000);
  const _racMk   = base.costoAlim/(base.tcTotal/1000);
  const _mRac    = (_racMk - base.racionInd)/base.racionInd*-1;
  h += `<tr><td>Costo ración ($/ton TC)<div class="nota" style="margin:3px 0 0">dieta ${$ar(_racBase)} + markup ${fmt0.format(P.margenes.markupAlim)}% = ${$ar(_racMk)}</div></td><td>${$ar(base.racionInd)}</td><td>${$ar(_racMk)}</td><td class="${_mRac<0?"neg":"pos"}">${pct1(_mRac)}</td></tr>`;
  h += `</table><div class="nota">Margen positivo = distancia a favor antes de que el resultado económico llegue a cero. Cálculo exacto sobre el mismo motor (incluye efecto en mortandad y comisiones).</div>`;

  // --- objetivo del operador ---
  const obj = cat.objetivo || {total:0, cabezas:0};
  if (obj.cabezas>0){
    const objCab = obj.total/obj.cabezas;
    const ind = indiferenciasObjetivo(cat, objCab);
    h += `<h2 style="margin-top:14px">Objetivo: ${$ar(obj.total)} en ${fmt0.format(obj.cabezas)} cab = ${$ar(objCab)}/cab</h2><table>
      <tr><th></th><th>Actual</th><th>Necesario</th><th>Δ</th></tr>`;
    const filaObj=(et,act,nec)=>{
      const delta=(nec-act)/act;
      return `<tr><td>${et}</td><td>${$ar(act)}</td><td>${isNaN(nec)?"—":$ar(nec)}</td><td class="${delta>0?"pos":"neg"}">${isNaN(nec)?"—":pct1(delta)}</td></tr>`;
    };
    h += filaObj("Precio venta carne ($/kg)", base.precioCarne, ind.pvCarne);
    h += filaObj("Precio compra ($/kg vivo)", base.precioCompra, ind.pCompra);
    h += filaObj("Maíz pizarra ($/ton)", P.insumos.maizPizarra, ind.maiz);
    h += `</table><div class="nota">Cada fila: el valor que tendría que tomar ESA variable (con todo lo demás constante) para que el lote alcance el resultado esperado. ${obj.total===0?"Con objetivo $ 0 equivale al punto de equilibrio.":""} Resultado actual del lote: ${$ar(base.resultado*obj.cabezas)} (${fmt0.format(obj.cabezas)} cab × ${$ar(base.resultado)}).</div>`;
  }

  h += `<h2 style="margin-top:14px">Hacienda propia — apertura de márgenes</h2><table>`;
  h += fila("Resultado ganadería", $ar(base.resultado), base.resultado<0?"neg":"");
  h += fila("Comisión de venta propia ("+fmt0.format(P.margenes.pctComisionPropia)+"% propio)", $ar(base.mComVenta));
  h += fila("Comisión de compra propia", $ar(base.mComCompra));
  h += fila("Comisión vendedor ("+fmt1.format(P.margenes.comVendedor)+"%)", $ar(base.mComVendedor));
  h += fila("Margen alimentación (markup feedlot)", $ar(base.margenAlim));
  h += fila("Hotelería propia", $ar(base.mHoteleria));
  h += fila("Margen sanidad", $ar(base.mSanidad));
  h += fila("Margen fletes propios", $ar(base.mFletes));
  h += `<tr class="total"><td>Resultado consolidado</td><td class="${base.consolidado<0?"neg":"pos"}">${$ar(base.consolidado)}</td></tr>`;
  h += fila("&nbsp;&nbsp;% sobre venta neta", pct1(base.consolidado/base.ventaTotal));
  h += `</table></div></div>`;

  // escenarios
  h += `<div class="dos-col"><div class="card"><h2>Escenarios</h2>`;
  h += svgEscenarios([
    {nombre:"Pesimista", valor:pes.resultado, color:"#b3372e"},
    {nombre:"Base", valor:base.resultado, color:"#2e6b34"},
    {nombre:"Optimista", valor:opt.resultado, color:"#27567d"},
  ]);
  h += `<table style="margin-top:8px"><tr><th></th><th>Pesimista</th><th>Base</th><th>Optimista</th></tr>`;
  const f3 = (et, fn, esPct)=>`<tr><td>${et}</td>`+[pes,base,opt].map(r=>{
      const v=fn(r); const s=esPct?pct1(v):$ar(v);
      return `<td class="${v<0?"neg":""}">${s}</td>`;}).join("")+`</tr>`;
  h += `<tr><td>% de engorde / ADG</td>`+[pes,base,opt].map(r=>`<td>${r.pctEngorde!==null?fmt1.format(r.pctEngorde*100)+"% · ":""}${fmt2.format(r.adg)} kg/d</td>`).join("")+`</tr>`;
  h += `<tr><td>Días de engorde</td>`+[pes,base,opt].map(r=>`<td>${fmt0.format(Math.round(r.dias))}</td>`).join("")+`</tr>`;
  h += f3("Resultado / cab", r=>r.resultado);
  h += f3("Resultado / kg producido", r=>r.resultado/r.kgProd);
  h += f3("Retorno s/ total", r=>r.retornoTotal, true);
  h += f3("TEA", r=>r.tea, true);
  h += f3("Consolidado propio", r=>r.consolidado);
  const escDeltas = [P.escenarios.pesimista, {dVenta:0,dCompra:0,dRacion:0,dEngorde:0}, P.escenarios.optimista];
  const _objCabEsc = (cat.objetivo && cat.objetivo.cabezas>0 && cat.objetivo.total>0) ? cat.objetivo.total/cat.objetivo.cabezas : 0;
  const indEsc = escDeltas.map(e=>indiferenciasEscenario(cat, e, _objCabEsc));
  const _lblObj = _objCabEsc>0 ? "p/ objetivo "+$ar(_objCabEsc)+"/cab" : "resultado = 0";
  h += `<tr><td>Precio compra de indiferencia ($/kg vivo)<div class="nota" style="margin:2px 0 0">${_lblObj} · actual ${$ar2(base.precioCompra)}</div></td>`+
    indEsc.map(ind=>`<td>${isNaN(ind.pCompra)?"—":$ar2(ind.pCompra)}</td>`).join("")+`</tr>`;
  const eo=P.escenarios.optimista, ep=P.escenarios.pesimista;
  const hayPrecios = eo.dVenta||eo.dCompra||eo.dRacion||ep.dVenta||ep.dCompra||ep.dRacion;
  h += `</table><div class="nota"><b>Cómo leerlos:</b> los escenarios mueven SOLO el % de engorde (optimista ${fmt2.format(eo.dEngorde)}% relativo: la hacienda engorda más rápido → menos días de corral → menos alimentación, hotelería y mortandad; pesimista al revés, ${fmt2.format(ep.dEngorde)}%). Para vacas equivale a 34% / 32% / 30% de la hoja "tabla". `+
  (hayPrecios
    ? `Además hay deltas de precios cargados (venta ${eo.dVenta}%/${ep.dVenta}%, compra ${eo.dCompra}%/${ep.dCompra}%, ración ${eo.dRacion}%/${ep.dRacion}%), por eso el resultado combina engorde + mercado.`
    : `Los precios de compra, venta y ración NO cambian entre escenarios (sus deltas están en 0; se pueden cargar en ⚙ Parámetros para combinar engorde + mercado).`)
  +`</div></div>`;

  h += `<div class="card"><h2>Composición de la venta</h2>`+svgComposicion(base);
  h += `<h2 style="margin-top:12px">Dieta y consumo</h2><table>
    <tr><th>Etapa</th><th>Días</th><th>kg TC/día</th><th>$ /ton TC</th><th>% MS</th></tr>`;
  base.etapas.forEach((e,i)=>{
    h += `<tr><td>Etapa ${i+1}</td><td>${fmt1.format(e.dias)}</td><td>${fmt1.format(e.kgDia)}</td><td>${$ar(e.costoTon)}</td><td>${fmt1.format(e.msEtapa)}</td></tr>`;
  });
  h += `<tr class="total"><td>Total</td><td>${fmt1.format(base.dias)}</td><td>—</td><td>${$ar(base.costoAlimBase/(base.tcTotal/1000))}</td><td>${fmt1.format(base.msPonder)}</td></tr>`;
  h += `</table>`;
  if (!sumaDietaOk) h += `<div class="nota" style="color:var(--rojo)">⚠ La composición de la dieta de alguna etapa no suma 100% (revisar en Parámetros base).</div>`;
  h += `<div class="nota">Mortandad ${fmt2.format(cat.mortMensual).replace(".",",")}% mensual (portal) prorrateada a ${fmt2.format(base.mortCiclo*100).replace(".",",")}% del ciclo, valuada al precio promedio compra/venta (convención del Excel). ${base.pctEngorde!==null?"Aumento diario calculado como promedio de pesos × % de engorde (tabla por peso de ingreso).":"Aumento diario fijo de esta categoría."}</div></div></div>`;

  out.innerHTML = h;
}

// ---------- panel de parámetros (programador) ----------
function renderParametros(){
  const cont = document.getElementById("panelParametros");
  cont.innerHTML = "";
  const mk = (titulo)=>{ const c=document.createElement("div"); c.className="card param-grupo"; c.innerHTML=`<h2>${titulo}</h2>`; cont.appendChild(c); return c; };
  const addGrid = (card, defs)=>{ // defs: [label, unidad, get, set, dec]
    const g=document.createElement("div"); g.className="grid g-inputs";
    for (const [lab,uni,get,set,dec] of defs) g.appendChild(inputCampo(lab,uni,get(),set,dec));
    card.appendChild(g);
  };

  const aviso = document.createElement("div"); aviso.className="card";
  aviso.innerHTML = `<h2>⚙ Parámetros base</h2><div class="nota">Esta pestaña es para el <b>administrador del simulador</b>. Los cambios aplican en vivo a todas las categorías, pero <b>no se guardan</b> al cerrar el archivo: los defaults se editan en el código (objetos <code>P</code> y <code>CATS</code>).</div>`;
  cont.appendChild(aviso);

  const ins = P.insumos;
  const c1 = mk("Insumos y servicios ($/ton salvo indicación)");
  addGrid(c1, [
    ["Maíz pizarra","$/ton",()=>ins.maizPizarra,v=>ins.maizPizarra=v],
    ["Contraflete","$/ton",()=>ins.contraflete,v=>ins.contraflete=v],
    ["Flete 90 km","$/ton",()=>ins.flete90,v=>ins.flete90=v],
    ["Gluten feed","$/ton",()=>ins.gluten,v=>ins.gluten=v],
    ["Núcleo","$/ton",()=>ins.nucleo,v=>ins.nucleo=v],
    ["Germen de maíz","$/ton",()=>ins.germen,v=>ins.germen=v],
    ["Rollo","$/ton",()=>ins.rollo,v=>ins.rollo=v],
    ["Relación silo/maíz","coef.",()=>ins.relSilo,v=>ins.relSilo=v,true],
    ["Relación hominy/maíz","coef.",()=>ins.relHominy,v=>ins.relHominy=v,true],
    ["Dólar","$/USD",()=>ins.dolar,v=>ins.dolar=v],
    ["Hotelería","$/cab/día",()=>ins.hoteleria,v=>ins.hoteleria=v],
    ["Sanidad","$/cab",()=>ins.sanidad,v=>ins.sanidad=v],
    ["Guías","$/cab",()=>ins.guias,v=>ins.guias=v],
    ["Flete jaula","$/km",()=>ins.fleteJaulaKm,v=>ins.fleteJaulaKm=v],
  ]);
  const der = preciosIngredientes(ins,0);
  const derDiv = document.createElement("div"); derDiv.className="nota";
  derDiv.innerHTML = `Derivados: maíz puesto ${$ar(der[0])} · silo ${$ar(der[1])} · hominy ${$ar(der[6])} (por ton).`;
  c1.appendChild(derDiv);

  const imp = P.impuestos, fin = P.financiero, mg = P.margenes;
  const c2 = mk("Impuestos, financiero y márgenes propios");
  addGrid(c2, [
    ["IVA venta hacienda","%",()=>imp.ivaVentaHacienda,v=>imp.ivaVentaHacienda=v,true],
    ["IVA compra hacienda","%",()=>imp.ivaCompraHacienda,v=>imp.ivaCompraHacienda=v,true],
    ["IVA fletes","%",()=>imp.ivaFletes,v=>imp.ivaFletes=v,true],
    ["IVA servicios","%",()=>imp.ivaServicios,v=>imp.ivaServicios=v,true],
    ["MNI ret. ganancias (RG 830)","$",()=>imp.mniRetGcias,v=>imp.mniRetGcias=v],
    ["Alícuota ret. ganancias","%",()=>imp.alicRetGcias,v=>imp.alicRetGcias=v,true],
    ["Tasa anual (TNA)","%",()=>fin.tasaAnual,v=>fin.tasaAnual=v,true],
    ["Plazo compra","días",()=>fin.plazoCompra,v=>fin.plazoCompra=v],
    ["Plazo venta","días",()=>fin.plazoVenta,v=>fin.plazoVenta=v],
    ["Días entre ciclos (corral vacío)","días",()=>P.anual.diasEntreCiclos,v=>P.anual.diasEntreCiclos=v],
    ["Markup alimentación","%",()=>mg.markupAlim,v=>mg.markupAlim=v,true],
    ["Comisión vendedor","%",()=>mg.comVendedor,v=>mg.comVendedor=v,true],
    ["Margen fletes propios","%",()=>mg.margenFlete,v=>mg.margenFlete=v,true],
    ["% operado por consignataria propia","%",()=>mg.pctComisionPropia,v=>mg.pctComisionPropia=v],
  ]);

  const c3 = mk("Escenarios — deltas en % sobre el caso base (principal: % de engorde)");
  addGrid(c3, [
    ["Optimista: Δ % de engorde","%",()=>P.escenarios.optimista.dEngorde,v=>P.escenarios.optimista.dEngorde=v,true],
    ["Pesimista: Δ % de engorde","%",()=>P.escenarios.pesimista.dEngorde,v=>P.escenarios.pesimista.dEngorde=v,true],
    ["Optimista: Δ precio venta","%",()=>P.escenarios.optimista.dVenta,v=>P.escenarios.optimista.dVenta=v,true],
    ["Optimista: Δ precio compra","%",()=>P.escenarios.optimista.dCompra,v=>P.escenarios.optimista.dCompra=v,true],
    ["Optimista: Δ costo ración","%",()=>P.escenarios.optimista.dRacion,v=>P.escenarios.optimista.dRacion=v,true],
    ["Pesimista: Δ precio venta","%",()=>P.escenarios.pesimista.dVenta,v=>P.escenarios.pesimista.dVenta=v,true],
    ["Pesimista: Δ precio compra","%",()=>P.escenarios.pesimista.dCompra,v=>P.escenarios.pesimista.dCompra=v,true],
    ["Pesimista: Δ costo ración","%",()=>P.escenarios.pesimista.dRacion,v=>P.escenarios.pesimista.dRacion=v,true],
  ]);

  for (const k of Object.keys(CATS)){
    const cat = CATS[k];
    const cc = mk("Categoría: "+cat.nombre);
    const defsCat = [];
    if (!cat.engorde) defsCat.push(["Aumento diario (fijo)","kg/día",()=>cat.adg,v=>cat.adg=v,true]);
    defsCat.push(
      ["Mortandad mensual","%",()=>cat.mortMensual,v=>cat.mortMensual=v,true],
      ["Comisión compra","%",()=>cat.comCompra,v=>cat.comCompra=v,true],
      ["Comisión venta","%",()=>cat.comVenta,v=>cat.comVenta=v,true],
      ["Desbaste compra","%",()=>cat.desbCompra,v=>cat.desbCompra=v,true],
      ["Desbaste venta","%",()=>cat.desbVenta,v=>cat.desbVenta=v,true],
      ["Decomiso","%",()=>cat.decomiso,v=>cat.decomiso=v,true],
      ["Kg por jaula (compra)","kg",()=>cat.kgJaulaCompra,v=>cat.kgJaulaCompra=v],
      ["Kg por jaula (venta)","kg",()=>cat.kgJaulaVenta,v=>cat.kgJaulaVenta=v],
      ["Cargo fijo flete compra","$",()=>cat.cargoFijoFlete,v=>cat.cargoFijoFlete=v],
      ["Días etapa 1","días",()=>cat.dias1,v=>cat.dias1=v],
      ["Días máx. etapa 2","días",()=>cat.dias2max,v=>cat.dias2max=v],
    );
    addGrid(cc, defsCat);
    if (cat.engorde){
      const notaEng = document.createElement("div"); notaEng.className="nota";
      const tEng = P.tablaEngorde[cat.engorde];
      notaEng.innerHTML = "Aumento diario automático: promedio(peso in, peso out) × % engorde según peso de ingreso — tabla \""+cat.engorde+"\": "+tEng.map(t=>t[0]+"–"+t[1]+" kg → "+fmt0.format(t[2]*100)+"%").join(" · ")+". (Editable en código: <code>P.tablaEngorde</code>.)";
      cc.appendChild(notaEng);
    }
    // dieta
    const dt = document.createElement("div");
    let th = `<h3>Composición de dieta (% por etapa — cada columna debe sumar 100)</h3><table class="dieta-tabla"><tr><th>Ingrediente</th><th>MS %</th><th>Etapa 1</th><th>Etapa 2</th><th>Etapa 3</th></tr>`;
    ING.forEach((nom,i)=>{
      th += `<tr><td>${nom}</td><td>${fmt1.format(P.ms[i])}</td>`;
      for (let e=0;e<3;e++){
        const id=`d_${k}_${e}_${i}`;
        th += `<td><input id="${id}" type="text" inputmode="decimal" value="${cat.dieta[e][i]}"></td>`;
      }
      th += `</tr>`;
    });
    th += `<tr class="total"><td>Suma</td><td></td>`;
    for (let e=0;e<3;e++) th += `<td id="s_${k}_${e}">${fmt0.format(cat.dieta[e].reduce((a,b)=>a+b,0))}</td>`;
    th += `</tr></table>`;
    dt.innerHTML = th;
    cc.appendChild(dt);
    setTimeout(()=>{
      ING.forEach((nom,i)=>{ for (let e=0;e<3;e++){
        const inp = document.getElementById(`d_${k}_${e}_${i}`);
        if (!inp) continue;
        inp.addEventListener("input", ()=>{
          cat.dieta[e][i]=parseNum(inp.value);
          const s = cat.dieta[e].reduce((a,b)=>a+b,0);
          const cel = document.getElementById(`s_${k}_${e}`);
          if (cel){ cel.textContent = fmt1.format(s); cel.style.color = Math.abs(s-100)<0.01? "":"var(--rojo)"; }
        });
      }});
    },0);
  }

  const c5 = mk("Tablas de consumo MS / peso vivo (kg MS por kg PV)");
  c5.innerHTML += `<div class="nota">Vacas y vaca corta usan la tabla VACAS; terneros/terneras la tabla MACHOS-HEMBRA (hoja "tabla" del Excel). Editables solo en código.</div>
  <table><tr><th>Tabla VACAS</th><th>Rango kg</th><th>Cons. MS/PV</th></tr>`+
  P.tablaVacas.map(t=>`<tr><td></td><td>${t[0]}–${t[1]}</td><td>${fmt2.format(t[2]*100)}%</td></tr>`).join("")+
  `<tr><th>Tabla MACHOS-HEMBRA</th><th></th><th></th></tr>`+
  P.tablaMachos.map(t=>`<tr><td></td><td>${t[0]}–${t[1]}</td><td>${fmt2.format(t[2]*100)}%</td></tr>`).join("")+`</table>`;
}

// ---------- panel comparativa anual entre categorías ----------
const COLORES_CAT = { vacas:"#2e6b34", vacaCorta:"#a06b00", terneros:"#27567d", terneras:"#8d4a8d" };

function renderComparativa(){
  const cont = document.getElementById("panelComparativa");
  const claves = Object.keys(CATS);
  const res = {};
  for (const k of claves) res[k] = calcular(CATS[k], {dVenta:0,dCompra:0,dRacion:0,dEngorde:0});

  let h = `<div class="card"><h2>Comparativa anual entre categorías — escenario base</h2>`;
  h += svgEscenarios(claves.map(k=>({nombre:CATS[k].nombre.split(" ")[0], valor:res[k].rentAnualSimple, color:COLORES_CAT[k]})), v=>pct1(v));
  h += `<div class="nota" style="text-align:center">Rentabilidad anual simple (retorno por ciclo × ciclos al año, sobre capital compra + costos)</div>`;
  h += `<table style="margin-top:10px"><tr><th></th>`+claves.map(k=>`<th>${CATS[k].nombre}</th>`).join("")+`</tr>`;
  const filaC = (et, fn, cls)=>`<tr><td>${et}</td>`+claves.map(k=>{
    const r=res[k]; if (r.error) return `<td>—</td>`;
    const {txt, neg} = fn(r, CATS[k]);
    return `<td class="${neg?"neg":(cls||"")}">${txt}</td>`;
  }).join("")+`</tr>`;
  const T=(txt,neg)=>({txt,neg:!!neg});
  h += filaC("Circuito (kg in → out)", (r,c)=>T(fmt0.format(c.cliente.kgIn)+" → "+fmt0.format(c.cliente.kgOut)));
  h += filaC("ADG / % engorde", r=>T(fmt2.format(r.adg)+" kg/d"+(r.pctEngorde!==null?" · "+fmt1.format(r.pctEngorde*100)+"%":" (fijo)")));
  h += filaC("Días de engorde", r=>T(fmt0.format(Math.round(r.dias))));
  h += filaC("Ciclos por año", r=>T(fmt2.format(r.ciclosAno)));
  h += filaC("Capital por cabeza (compra + costos)", r=>T($ar(r.capitalCab)));
  h += filaC("Resultado por ciclo / cab", r=>T($ar(r.resultado), r.resultado<0));
  h += filaC("Retorno por ciclo", r=>T(pct1(r.retornoTotal), r.retornoTotal<0));
  h += `<tr class="total">`+filaC("Rentabilidad anual simple", r=>T(pct1(r.rentAnualSimple), r.rentAnualSimple<0)).slice(4);
  h += filaC("Rentabilidad anual compuesta", r=>T(pct1(r.rentAnualCompuesta), r.rentAnualCompuesta<0));
  h += filaC("Resultado anual / cab-lugar", r=>T($ar(r.resultadoAnualCab), r.resultadoAnualCab<0));
  h += filaC("Consolidado anual / cab-lugar (hacienda propia)", r=>T($ar(r.consolidado*r.ciclosAno), r.consolidado<0));
  h += `</table>`;
  h += `<div style="margin-top:14px">`+svgEscenarios(claves.map(k=>({nombre:CATS[k].nombre.split(" ")[0], valor:res[k].resultadoAnualCab, color:COLORES_CAT[k]}))) +`</div>`;
  h += `<div class="nota" style="text-align:center">Resultado anual en $ por cabeza-lugar (resultado por ciclo × ciclos al año)</div>`;
  h += `<div class="nota">Ciclos por año = 365 ÷ (días de engorde + ${fmt0.format(P.anual.diasEntreCiclos)} días entre ciclos, editable en ⚙ Parámetros). La rentabilidad simple supone reponer el mismo capital cada ciclo; la compuesta supone reinvertir el resultado. Cada categoría usa los datos cargados en su propia pestaña.</div>`;
  h += `</div>`;
  cont.innerHTML = h;

  // --- card B: comparativa con resultado objetivo por cabeza ---
  const cardB = document.createElement("div"); cardB.className="card";
  cardB.innerHTML = `<h2>Comparativa anual con resultado objetivo por cabeza</h2>`;
  const gB = document.createElement("div"); gB.className="grid g-inputs"; gB.style.maxWidth="280px";
  gB.appendChild(inputCampo("Resultado objetivo por ciclo","$ /cab",objetivoComp,v=>{objetivoComp=v; renderCompObjetivo();}));
  cardB.appendChild(gB);
  const divObj = document.createElement("div"); divObj.id="compObjetivo";
  cardB.appendChild(divObj);
  cont.appendChild(cardB);
  renderCompObjetivo();
}

function renderCompObjetivo(){
  const div = document.getElementById("compObjetivo");
  if (!div) return;
  const claves = Object.keys(CATS);
  const res = {}, indis = {};
  for (const k of claves){
    res[k] = calcular(CATS[k], {dVenta:0,dCompra:0,dRacion:0,dEngorde:0});
    indis[k] = indiferenciasObjetivo(CATS[k], objetivoComp);
  }
  let h = svgEscenarios(claves.map(k=>({nombre:CATS[k].nombre.split(" ")[0], valor:objetivoComp*res[k].ciclosAno, color:COLORES_CAT[k]})));
  h += `<div class="nota" style="text-align:center">Resultado anual por cabeza-lugar si CADA categoría lograra ${$ar(objetivoComp)}/cab por ciclo (el efecto puro de la rotación)</div>`;
  h += `<table style="margin-top:10px"><tr><th></th>`+claves.map(k=>`<th>${CATS[k].nombre}</th>`).join("")+`</tr>`;
  const fila = (et, fn)=>`<tr><td>${et}</td>`+claves.map(k=>{
    const {txt, neg} = fn(res[k], indis[k], CATS[k]);
    return `<td class="${neg?"neg":""}">${txt}</td>`;
  }).join("")+`</tr>`;
  const T=(txt,neg)=>({txt,neg:!!neg});
  h += fila("Ciclos por año", r=>T(fmt2.format(r.ciclosAno)));
  h += fila("Resultado anual / cab-lugar", r=>T($ar(objetivoComp*r.ciclosAno)));
  h += fila("Capital por cabeza", r=>T($ar(r.capitalCab)));
  h += fila("Rentabilidad anual con objetivo", r=>T(pct1(objetivoComp*r.ciclosAno/r.capitalCab)));
  h += fila("Resultado actual por ciclo (de referencia)", r=>T($ar(r.resultado), r.resultado<0));
  h += fila("Precio venta carne necesario", (r,i,c)=>{
    const delta=(i.pvCarne-c.cliente.precioCarne)/c.cliente.precioCarne;
    return T(isNaN(i.pvCarne)?"—":$ar(i.pvCarne)+" ("+(delta>=0?"+":"")+fmt1.format(delta*100)+"%)", delta>0.10);
  });
  h += fila("o precio compra necesario", (r,i,c)=>{
    const delta=(i.pCompra-c.cliente.precioCompra)/c.cliente.precioCompra;
    return T(isNaN(i.pCompra)?"—":$ar(i.pCompra)+" ("+(delta>=0?"+":"")+fmt1.format(delta*100)+"%)", delta<-0.10);
  });
  h += `</table><div class="nota">Lectura: con el mismo resultado por cabeza, la categoría que más rota multiplica más veces ese resultado en el año. Las dos últimas filas muestran qué precio de venta (o de compra) necesitaría cada categoría para alcanzar el objetivo por ciclo con todo lo demás constante — entre paréntesis, la distancia contra el precio actual cargado.</div>`;
  div.innerHTML = h;
}

function render(){
  elTabs();
  document.getElementById("panelCategoria").style.display = vista==="cat"?"block":"none";
  document.getElementById("panelComparativa").style.display = vista==="comp"?"block":"none";
  document.getElementById("panelParametros").style.display = vista==="params"?"block":"none";
  if (vista==="params") renderParametros();
  else if (vista==="comp") renderComparativa();
  else renderCategoria();
}

render();
</script>
