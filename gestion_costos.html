<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión y Costos · PEGSA</title>
<!--
  v15.88 · Gestión y Costos (PORTAL_COSTOS_20, Nicolás 14/10/2026)
  ─────────────────────────────────────────────────────────────────
  Página propia como compras.html / analisis_costos.html. Lee los cierres de
  gestión y los grupos de costos que publica el PORTAL DE COSTOS local (botón
  «Publicar») en el proyecto Supabase DEDICADO «gestion» (tablas gc_*).

  ⚠ ESTE ARCHIVO NO TIENE NINGÚN NÚMERO. El repo es GitHub Pages: todo lo que
  esté acá lo lee cualquiera con la URL. Los números viven en Supabase con RLS:
  la clave de abajo es la PUBLICABLE (anon, pública por diseño) y sin sesión
  no lee nada (probado: 0 filas). La sesión es la de Supabase Auth del
  proyecto «gestion» (usuarios que crea Nicolás), distinta de la de Hotelería.
  La clave service_role NUNCA va acá: queda en el .env del portal de costos.

  v15.88.1 (15/10/2026) · «Tablero de gestión» (margen s/ facturado + torta de
  participación por centro) y «Tablero de costos» (resumen por mes, barras de
  crecimiento, tortas por cuenta y por centro). Todo sale de lo publicado; los
  gráficos nuevos son SVG propios (sin librerías nuevas, andan sin internet).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* Mismos tokens que compras.html / analisis_costos.html */
  :root{
    --bg:#faf8f4; --surface:#FFF; --surface-2:#f7f5f0;
    --border:#e3e1da; --border-2:#d8d6ce;
    --ink:#1a1612; --text-2:#4a453f; --mutedc:#8a827a;
    --accent:#b8922a; --accent-bright:#d4a84b; --accent-soft:#faf6ea;
    --verde:#27613d; --verde-soft:#eef5f0;
    --ambar:#b8922a; --ambar-soft:#fdf6e3;
    --rojo:#c0392b; --rojo-soft:#fbebe8;
    --azul:#2d6a8a; --azul-soft:#eef4f7;
    --navy:#0F1B64;
    --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans)}
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);
    padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  header h1{font-family:var(--serif);font-weight:700;font-size:20px;margin:0}
  header a.volver{font-family:var(--mono);font-size:11px;color:var(--mutedc);text-decoration:none}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{all:unset;font-family:var(--mono);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;
    padding:6px 11px;border-radius:6px;cursor:pointer;color:var(--text-2)}
  nav button.on{background:var(--accent);color:#fff}
  .sesion{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mutedc);display:flex;align-items:center;gap:8px}
  main{max-width:1400px;margin:0 auto;padding:18px 24px 60px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}
  .card h2{font-family:var(--serif);font-weight:700;font-size:17px;margin:0 0 6px}
  .muted{color:var(--mutedc);font-size:12.5px}
  .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mutedc);margin-bottom:3px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent)}
  .kpis{display:flex;flex-wrap:wrap;gap:22px;margin:8px 0}
  .kpi .v{font-size:22px;font-weight:700;font-family:var(--serif)}
  .kpi .v.grande{font-size:30px}
  .kpi .d{font-family:var(--mono);font-size:11px;color:var(--mutedc)}
  .neg{color:var(--rojo)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mutedc);font-weight:600;
    text-align:left;padding:6px 8px;border-bottom:1px solid var(--border-2);background:var(--surface)}
  td{padding:5px 8px;border-bottom:1px solid var(--border)}
  .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.ram td{background:var(--surface-2);font-weight:700}
  tr.sub td{font-weight:600}
  tr.cen{cursor:pointer} tr.cen:hover td{background:var(--accent-soft)}
  tr.cta td{font-size:11.5px;color:var(--text-2)}
  tfoot td{font-weight:700;border-top:2px solid var(--border-2);background:var(--surface-2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
  .emp-card .flecha{font-size:14px}
  button.btn{height:32px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:#fff;
    padding:0 14px;font-family:var(--mono);font-size:11.5px;cursor:pointer}
  button.btn.sec{background:var(--surface);color:var(--text-2);border-color:var(--border-2)}
  select,input{height:32px;border:1px solid var(--border-2);border-radius:7px;padding:0 8px;font:400 13px var(--sans);background:var(--surface)}
  .aviso{background:var(--ambar-soft);border:1px solid #e8d9ad;color:#7a5c12;border-radius:8px;padding:8px 12px;font-size:12.5px;margin:0 0 12px}
  .aviso.err{background:var(--rojo-soft);border-color:#e8c4bd;color:var(--rojo)}
  .seg{display:inline-flex;border:1px solid var(--border-2);border-radius:7px;overflow:hidden;height:28px}
  .seg button{all:unset;padding:0 9px;display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--text-2)}
  .seg button.on{background:var(--accent);color:#fff}
  #login{max-width:380px;margin:80px auto}
  #login .card{padding:26px}
  #login input{width:100%;margin:4px 0 12px}
  .oculto{display:none}
  .scroll{overflow:auto;max-height:620px}
  /* v15.88.1 · tableros (gráficos SVG propios: sin librerías nuevas, igual con o sin internet) */
  .grid{grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr))}
  .torta-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(250px,2fr);gap:18px;align-items:start}
  .tortas2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
  .tortas2 .card{margin-bottom:0}
  svg.graf{width:100%;height:auto;display:block}
  svg.graf text{font-family:var(--sans)}
  svg.graf path[data-i]:hover{opacity:.85}
  .leg{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px}
  .leg li{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer;border-bottom:1px solid var(--border)}
  .leg i{width:11px;height:11px;border-radius:3px;flex:none}
  .leg .num{margin-left:auto}
  .restan .lbl{color:var(--rojo)}
  .restan tr{cursor:pointer} .restan tr:hover td{background:var(--rojo-soft)}
  .nota{font-size:11.5px;color:var(--mutedc);margin:4px 0 0}
  .vacio{border:1px dashed var(--border-2);border-radius:8px;padding:14px;color:var(--mutedc);font-size:12.5px;text-align:center}
  .filtro{display:inline-flex;gap:8px;align-items:center;background:var(--accent-soft);border:1px solid #ecdcae;border-radius:8px;padding:5px 10px;font-size:12.5px;margin:6px 0}
  td.hl,th.hl{background:var(--accent-soft)}
  .kpi .d.mg{color:var(--text-2);font-size:11.5px}
  tr.flash td{animation:flash 2.6s ease-out}
  @keyframes flash{0%{background:#f3e3b0}100%{background:transparent}}
  @media (max-width:760px){
    header{padding:10px 14px} main{padding:14px 12px 50px}
    .torta-grid,.tortas2{grid-template-columns:1fr}
    .kpi .v.grande{font-size:24px}
  }
</style>
</head>
<body>
<header>
  <h1>Gestión y Costos</h1>
  <a class="volver" href="index.html">← Portal</a>
  <nav id="nav" class="oculto">
    <button data-v="tablero" class="on">Tablero de gestión</button>
    <button data-v="costos">Tablero de costos</button>
    <button data-v="cierre">Un cierre</button>
    <button data-v="comparar">Comparar</button>
    <button data-v="grupos">Costos · grupo</button>
  </nav>
  <div class="sesion" id="sesion"></div>
</header>

<main>
  <!-- LOGIN: sin sesión no se pide ningún dato -->
  <div id="login" class="oculto">
    <div class="card">
      <h2>Acceso restringido</h2>
      <p class="muted" style="margin-top:0">Resultados de gestión y costos. Ingresá con tu usuario de
        <b>Gestión</b> (Supabase · proyecto «gestion»; no es el de Hotelería ni el del portal).</p>
      <div class="lbl">Email</div><input id="lEmail" type="email" autocomplete="username">
      <div class="lbl">Contraseña</div><input id="lPass" type="password" autocomplete="current-password">
      <div id="lErr" class="aviso err oculto"></div>
      <button class="btn" id="lBtn" style="width:100%">Ingresar</button>
    </div>
  </div>
  <div id="sinRed" class="card oculto"><h2>Sin conexión</h2>
    <p class="muted">No se pudo conectar con el servidor de datos. Revisá la conexión y recargá.</p></div>

  <div id="app" class="oculto">
    <section id="v-tablero"></section>
    <section id="v-costos" class="oculto"></section>
    <section id="v-cierre" class="oculto"></section>
    <section id="v-comparar" class="oculto"></section>
    <section id="v-grupos" class="oculto"></section>
  </div>
</main>

<script>
/* ── configuración: SOLO la clave publicable (anon) del proyecto «gestion» ── */
var GC_CFG = {
  url:  'https://lahflesddeazgezatcct.supabase.co',
  anon: 'sb_publishable_30z-8e1wLarzjIktPk3JRw_SWra2qAb'
};
var GC = { sb: null, user: null, empresas: [], cierres: [], cache: {} };

/* ── formato es-AR ── */
function pesos(n, dec) {
  if (n == null || isNaN(n)) return '—';
  return '$ ' + Number(n).toLocaleString('es-AR', {minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0});
}
function num(n) { return n == null ? '—' : Number(n).toLocaleString('es-AR', {maximumFractionDigits: 0}); }
function pct(n) { return n == null ? '' : Number(n).toLocaleString('es-AR', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' %'; }
/* v15.88.1 · margen = resultado ÷ ingresos facturados (sin ingresos → null → «—», nunca ∞) */
function margen(res, ing) { ing = Number(ing); return ing && isFinite(ing) ? Number(res) / ing * 100 : null; }
function pctM(v) { return v == null ? '—' : pct(v); }
function pp(d) { return (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d).toLocaleString('es-AR', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' pp'; }
function millones(v) { return (Number(v) / 1e6).toLocaleString('es-AR', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' M'; }
var TIP_MG = 'resultado ÷ ingresos facturados del período';
/* preferencias del usuario (pestaña, empresa, grupo, métrica) */
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem('gc_' + k); return v == null ? d : v; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('gc_' + k, v); } catch (e) { /* sin storage: no pasa nada */ } }
};
function fecha(s) { if (!s) return '—'; var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : s; }
function fechaHora(s) {
  if (!s) return '—';
  try { var d = new Date(s); return d.toLocaleDateString('es-AR', {day: '2-digit', month: '2-digit', year: 'numeric'}) + ' ' + d.toLocaleTimeString('es-AR', {hour: '2-digit', minute: '2-digit'}); }
  catch (e) { return s; }
}
function mesTxt(m) { if (!m || m === 'dif_stock') return m === 'dif_stock' ? 'Dif. stock' : '—'; return m.slice(5, 7) + '/' + m.slice(0, 4); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function cls(n) { return Number(n) < 0 ? ' neg' : ''; }
function $(id) { return document.getElementById(id); }

/* ── acceso a datos: TODO pasa por acá (sesión + RLS) ── */
GC.leer = async function (tabla, filtros, orden) {
  var k = tabla + JSON.stringify(filtros || {}) + (orden || '');
  if (GC.cache[k]) return GC.cache[k];
  var out = [], desde = 0, paso = 1000;
  while (true) {
    var q = GC.sb.from(tabla).select('*');
    Object.keys(filtros || {}).forEach(function (c) { q = q.eq(c, filtros[c]); });
    if (orden) orden.split(',').forEach(function (o) { q = q.order(o.trim()); });
    var r = await q.range(desde, desde + paso - 1);
    if (r.error) throw r.error;
    out = out.concat(r.data || []);
    if (!r.data || r.data.length < paso) break;
    desde += paso;
  }
  GC.cache[k] = out;
  return out;
};

/* ── sesión ── */
async function arrancar() {
  if (!window.supabase) { $('sinRed').classList.remove('oculto'); return; }
  GC.sb = window.supabase.createClient(GC_CFG.url, GC_CFG.anon, {auth: {persistSession: true, storageKey: 'pegsa-gestion-auth'}});
  var s = await GC.sb.auth.getSession();
  if (s.data && s.data.session) return GC.iniciar(s.data.session.user);
  mostrarLogin();
}
function mostrarLogin(msg) {
  $('app').classList.add('oculto'); $('nav').classList.add('oculto'); $('sesion').innerHTML = '';
  $('login').classList.remove('oculto');
  if (msg) { $('lErr').textContent = msg; $('lErr').classList.remove('oculto'); }
}
$('lBtn').onclick = async function () {
  $('lErr').classList.add('oculto');
  var r = await GC.sb.auth.signInWithPassword({email: $('lEmail').value.trim(), password: $('lPass').value});
  if (r.error) return mostrarLogin(r.error.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos.' : r.error.message);
  $('lPass').value = '';
  GC.iniciar(r.data.user);
};
$('lPass').onkeydown = function (e) { if (e.key === 'Enter') $('lBtn').click(); };
async function salir() { await GC.sb.auth.signOut(); GC.cache = {}; location.reload(); }

GC.iniciar = async function (user) {
  GC.user = user;
  $('login').classList.add('oculto');
  $('sesion').innerHTML = esc(user.email || '') + ' · <a href="#" onclick="salir();return false">salir</a>';
  try {
    GC.empresas = await GC.leer('gc_empresas', {}, 'orden');
    GC.cierres = await GC.leer('gc_cierres', {vigente: true}, 'empresa_id,mes');
  } catch (e) {
    return mostrarLogin('No se pudieron leer los datos: ' + (e.message || e));
  }
  $('nav').classList.remove('oculto'); $('app').classList.remove('oculto');
  var h = leerHash();
  ver(h.v || LS.get('vista', 'tablero'), h.arg);
};
document.querySelectorAll('#nav button').forEach(function (b) { b.onclick = function () { ver(b.dataset.v); }; });
var VISTAS = {tablero: 'vTablero', costos: 'vCostos', cierre: 'vCierre', comparar: 'vComparar', grupos: 'vGrupos'};
function ver(v, arg) {
  if (!VISTAS[v]) v = 'tablero';
  LS.set('vista', v);
  escribirHash(v, arg);
  document.querySelectorAll('#nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); });
  Object.keys(VISTAS).forEach(function (x) { $('v-' + x).classList.toggle('oculto', x !== v); });
  window[VISTAS[v]](arg);
  window.scrollTo(0, 0);
}
/* estado en la URL: #grupos?g=<grupo>&cta=<cuenta> (sirve con file:// y con servidor) */
function escribirHash(v, arg) {
  var q = Object.keys(arg || {}).filter(function (k) { return arg[k] != null && arg[k] !== ''; })
    .map(function (k) { return k + '=' + encodeURIComponent(arg[k]); }).join('&');
  try { history.replaceState(null, '', '#' + v + (q ? '?' + q : '')); } catch (e) { /* file:// viejo */ }
}
function leerHash() {
  var m = String(location.hash || '').match(/^#(\w+)(?:\?(.*))?$/);
  if (!m || !VISTAS[m[1]]) return {};
  var arg = {};
  (m[2] || '').split('&').forEach(function (p) {
    var kv = p.split('='); if (!kv[0]) return;
    var v = decodeURIComponent(kv[1] || '');
    arg[kv[0]] = (kv[0] === 'v' || kv[0] === 'comp') ? Number(v) : v;
  });
  return {v: m[1], arg: Object.keys(arg).length ? arg : null};
}
function cierresDe(eid) { return GC.cierres.filter(function (c) { return c.empresa_id === eid; }).sort(function (a, b) { return a.mes < b.mes ? -1 : 1; }); }
function nomEmp(eid) { var e = GC.empresas.filter(function (x) { return x.id === eid; })[0]; return e ? e.nombre : eid; }
function empElegida(arg) {
  var ids = GC.empresas.map(function (e) { return e.id; }), e = (arg && arg.e) || LS.get('emp');
  e = ids.indexOf(e) >= 0 ? e : ids[0];
  if (e) LS.set('emp', e);
  return e;
}

/* ══════════ 1 · tablero ══════════ */
var MET = {final: 'Resultado final', sin_tenencia: 'Resultado s/ tenencia', operativo: 'Resultado operativo'};
var SERIE = LS.get('metrica', 'final'), CHARTS = [];
if (!MET[SERIE]) SERIE = 'final';
function lnk(txt, v, arg) { return '<a href="#" onclick=\'ver("' + v + '",' + esc(JSON.stringify(arg)).replace(/'/g, '&#39;') + ');return false\'>' + txt + '</a>'; }
function vTablero() {
  CHARTS.forEach(function (c) { c.destroy(); }); CHARTS = [];
  var h = '<div class="card"><h2>Tablero de gestión</h2><p class="muted" style="margin:0">Cada cierre es la gestión '
    + '<b>anualizada</b>: los 12 meses terminados en el mes cerrado. Por defecto el número grande es el <b>resultado final</b> '
    + '(s/ tenencia + tenencia), como en el portal de costos. Métrica: <span class="seg" id="segSerie">'
    + '<button data-s="final">final</button><button data-s="sin_tenencia">s/ tenencia</button><button data-s="operativo">operativo</button></span></p></div>'
    + '<div class="grid">';
  GC.empresas.forEach(function (e) {
    var cs = cierresDe(e.id), u = cs[cs.length - 1], p = cs[cs.length - 2];
    h += '<div class="card emp-card"><h2>' + esc(e.nombre) + ' <span class="pill">' + esc(e.grupo) + '</span></h2>';
    if (!u) { h += '<div class="vacio">Sin datos: no hay cierres publicados.</div></div>'; return; }
    var dif = p ? u[SERIE] - p[SERIE] : null, base = p ? Math.abs(p[SERIE]) : null;
    var sub = SERIE === 'final' ? 's/ tenencia ' + pesos(u.sin_tenencia) + ' · tenencia ' + pesos(u.tenencia)
      : SERIE === 'sin_tenencia' ? 'operativo ' + pesos(u.operativo) + ' · dif. de stock ' + pesos(u.dif_stock)
      : 'ingresos ' + pesos(u.ingresos) + ' · egresos ' + pesos(u.egresos);
    var mg = margen(u[SERIE], u.ingresos), mgp = p ? margen(p[SERIE], p.ingresos) : null;
    h += '<div class="muted">cierre ' + lnk(mesTxt(u.mes), 'cierre', {e: e.id, m: u.mes}) + ' · ventana '
      + fecha(u.desde) + ' → ' + fecha(u.hasta) + ' · versión ' + u.version + '</div>'
      + '<div class="kpi"><div class="lbl">' + MET[SERIE] + '</div><div class="v grande' + cls(u[SERIE]) + '">' + pesos(u[SERIE]) + '</div>'
      + '<div class="d mg" title="' + TIP_MG + '">margen s/ facturado <b>' + pctM(mg) + '</b>'
      + (mg != null && mgp != null ? ' <span style="color:' + (mg - mgp >= 0 ? 'var(--verde)' : 'var(--rojo)') + '">' + pp(mg - mgp) + '</span> contra ' + mesTxt(p.mes) : '')
      + (SERIE === 'operativo' ? '' : ' <span class="muted">(ingresos ' + pesos(u.ingresos) + ')</span>') + '</div>'
      + '<div class="d">' + sub + '</div></div>';
    if (dif != null) h += '<div class="flecha" style="color:' + (dif >= 0 ? 'var(--verde)' : 'var(--rojo)') + '">'
      + (dif > 0 ? '▲' : dif < 0 ? '▼' : '=') + ' ' + pesos(Math.abs(dif)) + (base ? ' (' + pct(dif / base * 100) + ')' : '')
      + ' <span class="muted">contra ' + mesTxt(p.mes) + ' · ' + lnk('qué lo explica', 'comparar', {e: e.id, a: p.mes, b: u.mes}) + '</span></div>';
    else h += '<div class="muted">primer cierre publicado</div>';
    h += '<div style="height:170px;margin-top:8px"><canvas id="ch_' + e.id + '"></canvas></div></div>';
  });
  var eT = empElegida();

    var total = xs.reduce(function (s, x) { return s + x.v; }, 0), sl = xs.slice(0, xs.length <= n + 1 ? n + 1 : n);
    var resto = xs.slice(sl.length);

  },
  /* resumen de un grupo de costos entre d y h (AAAA-MM). Por cuenta sale de gc_grupo_cuentas,

      if (!pc[x.comp]) pc[x.comp] = {i: x.comp, c: {empresa: x.empresa, centro: x.centro, centro_nombre: x.centro_nombre}, e: 0, ing: 0};

      var c = cta[q.cuenta] = cta[q.cuenta] || {cuenta: q.cuenta, nombre: (q.cuenta_nombre || '').trim(), e: 0, ing: 0};

  }

    + '<div>' + comps.map(function (c, i) { return '<span class="pill" style="margin:0 4px 4px 0">' + esc(c.centro) + ' ' + esc(c.centro_nombre || '') + ' · ' + (tot ? pct(totC[i] / tot * 100) : '') + '</span>'; }).join('') + '</div></div>';
  // v15.88.1 · filtros que llegan desde las tortas del tablero de costos
  var ctasV = ctas.filter(function (q) { return (fCta == null || q.cuenta === fCta) && (fComp == null || q.comp === fComp); });
  if (fCta != null || fComp != null) {
    var cc = comps[fComp] || {}, cn = (ctas.filter(function (q) { return q.cuenta === fCta; })[0] || {}).cuenta_nombre || '';
    h += '<div class="filtro">Filtrado por ' + (fCta != null ? 'cuenta <b>' + esc(fCta) + ' ' + esc(cn) + '</b>' : '')
      + (fCta != null && fComp != null ? ' y ' : '') + (fComp != null ? 'centro <b>' + esc(cc.centro || '') + ' ' + esc(cc.centro_nombre || '') + '</b>' : '')
      + ' · ' + pesos(ctasV.reduce(function (s, q) { return s + Number(q.egresos); }, 0)) + ' en el período publicado completo'
      + ' <a href="#" id="gSinFiltro">quitar filtro</a></div>';
  }
  h += '<div class="card" style="overflow:auto"><h2>Costos por mes</h2><table><tr><th>Mes</th>' + comps.map(function (c, i) { return '<th class="num' + (i === fComp ? ' hl' : '') + '">' + esc(c.centro) + ' ' + esc((c.centro_nombre || '').slice(0, 20)) + '</th>'; }).join('') + '<th class="num">Total</th></tr>'
    + porMes.map(function (p) { return '<tr><td>' + mesTxt(p.m) + '</td>' + comps.map(function (c, i) { return '<td class="num' + (i === fComp ? ' hl' : '') + '">' + num(E[p.m + '|' + i] || 0) + '</td>'; }).join('') + '<td class="num"><b>' + num(p.t) + '</b></td></tr>'; }).join('')
    + '<tfoot><tr><td>Total</td>' + totC.map(function (v) { return '<td class="num">' + num(v) + '</td>'; }).join('') + '<td class="num">' + num(tot) + '</td></tr></tfoot></table>'
    + (Object.keys(I).some(function (k) { return I[k]; }) ? '<p class="muted">Ingresos en el período: ' + comps.map(function (c, i) { return I[i] ? esc(c.centro) + ' ' + pesos(I[i]) : ''; }).filter(Boolean).join(' · ') + '</p>' : '')
    + '</div><div class="card" style="overflow:auto" id="gDetalle"><h2>Detalle por cuenta <span class="muted">(período publicado completo)</span></h2><table><tr><th>Componente</th><th>Cuenta</th><th>Origen</th><th class="num">Movs</th><th class="num">Egresos</th><th class="num">Ingresos</th></tr>'
    + ctasV.slice().sort(function (a, b) { return a.comp - b.comp || b.egresos - a.egresos; }).map(function (q) {
        var c = comps[q.comp] || {};
        return '<tr><td>' + esc(c.centro || q.centro) + ' ' + esc((c.centro_nombre || '').slice(0, 22)) + '</td><td>' + esc(q.cuenta) + ' <span class="muted">' + esc(q.cuenta_nombre) + '</span></td><td class="muted">' + esc(q.origen_mov)
          + '</td><td class="num">' + q.n + '</td><td class="num">' + num(q.egresos) + '</td><td class="num">' + (Number(q.ingresos) ? num(q.ingresos) : '') + '</td></tr>';
      }).join('') + '</table></div>';
  V.innerHTML = h;
  $('gSel').onchange = function () { ver('grupos', {g: this.value}); };
  $('gD').onchange = $('gH').onchange = function () { ver('grupos', {g: g.id, d: $('gD').value, h: $('gH').value, cta: fCta, comp: fComp}); };
  if ($('gSinFiltro')) $('gSinFiltro').onclick = function () { ver('grupos', {g: g.id, d: d, h: hh}); return false; };
  if (fCta != null || fComp != null) setTimeout(function () { $('gDetalle').scrollIntoView({block: 'start'}); }, 0);
}
function grupoElegido(gs, arg) {
  var id = (arg && arg.g) || LS.get('grupo'), g = gs.filter(function (x) { return x.id === id; })[0] || gs[0];
  LS.set('grupo', g.id);
  return g;
}

/* ══════════ 5 · tablero de costos (v15.88.1) ══════════ */
var COMP_ON = LS.get('porcomp', '0') === '1';
async function vCostos(arg) {
  var V = $('v-costos');
  V.innerHTML = '<div class="card muted">cargando…</div>';
  var gs = await GC.leer('gc_grupos', {vigente: true}, 'nombre');
  if (!gs.length) { V.innerHTML = '<div class="card"><h2>Tablero de costos</h2><div class="vacio">Sin datos: no hay grupos publicados. Se publican desde el Portal de Costos → /grupos → «Publicar grupo».</div></div>'; return; }
  var g = grupoElegido(gs, arg);
  var meses = await GC.leer('gc_grupo_meses', {grupo_id: g.id, version: g.version}, 'mes_op');
  var ctas = await GC.leer('gc_grupo_cuentas', {grupo_id: g.id, version: g.version});
  var R = GCcalc.resumenGrupo(g, meses, ctas, arg && arg.d, arg && arg.h), comps = g.componentes || [];
  var opt = function (id, v) { return '<select id="' + id + '">' + R.todos.map(function (m) { return '<option value="' + m + '"' + (m === v ? ' selected' : '') + '>' + mesTxt(m) + '</option>'; }).join('') + '</select>'; };
  var h = '<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Tablero de costos</h2><select id="kSel">'
    + gs.map(function (x) { return '<option value="' + x.id + '"' + (x.id === g.id ? ' selected' : '') + '>' + esc(x.nombre) + '</option>'; }).join('') + '</select>'
    + (R.todos.length ? ' desde ' + opt('kD', R.d) + ' hasta ' + opt('kH', R.h) : '')
    + ' <button class="btn sec" id="kCsv"' + (R.ms.length ? '' : ' disabled') + '>Descargar Excel (CSV)</button></div>'
    + '<div class="muted" style="margin-top:6px">' + esc(g.nombre) + ' · versión ' + g.version + ' · grupo desde ' + fecha(g.desde) + ' · publicado ' + fecha(g.periodo_desde) + ' → ' + fecha(g.periodo_hasta)
    + ' · Datos de Physis al ' + fechaHora(g.datos_physis_al) + ' · Publicado el ' + fechaHora(g.publicado_el) + '</div>';
  if (!R.ms.length) {
    V.innerHTML = h + '<div class="vacio" style="margin-top:10px">Sin datos: el grupo no tiene meses publicados.</div></div>';
    $('kSel').onchange = function () { ver('costos', {g: this.value}); };
    return;
  }
  var pm = R.porMes, u = pm[pm.length - 1], p = pm[pm.length - 2], dv = p ? u.e - p.e : null;
  h += '<div class="kpis"><div class="kpi"><div class="lbl">Costo total · ' + mesTxt(R.d) + ' → ' + mesTxt(R.h) + '</div><div class="v grande">' + pesos(R.total) + '</div></div>'
    + '<div class="kpi"><div class="lbl">Promedio mensual · ' + R.ms.length + ' ' + (R.ms.length === 1 ? 'mes' : 'meses') + '</div><div class="v">' + pesos(R.total / R.ms.length) + '</div></div>'
    + '<div class="kpi"><div class="lbl">Último mes · ' + mesTxt(u.m) + '</div><div class="v">' + pesos(u.e) + '</div></div>'
    + '<div class="kpi"><div class="lbl">Variación ' + (p ? mesTxt(u.m) + ' vs ' + mesTxt(p.m) : '') + '</div>'
    + (p ? '<div class="v" style="color:' + (dv > 0 ? 'var(--rojo)' : 'var(--verde)') + '">' + (dv > 0 ? '▲ +' : dv < 0 ? '▼ ' : '= ') + (p.e ? pct(dv / Math.abs(p.e) * 100) : '—') + '</div>'
      + '<div class="d">' + (dv > 0 ? '+' : '') + pesos(dv) + '</div>' : '<div class="v muted">—</div><div class="d">un solo mes en el rango</div>') + '</div></div></div>';
  // tabla resumen por mes (+ componentes)
  var conIng = R.totalIng !== 0;
  var th = '<tr><th>Mes</th><th class="num">Costo</th>' + (conIng ? '<th class="num">Ingresos</th><th class="num">Costo neto</th>' : '')
    + (COMP_ON ? R.porComp.map(function (c) { return '<th class="num" title="' + esc(c.c.empresa + ' ' + c.c.centro + ' ' + (c.c.centro_nombre || '')) + '">' + esc(c.c.centro) + ' ' + esc(corto(c.c.centro_nombre, 16)) + '</th>'; }).join('') : '') + '</tr>';
  h += '<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Costos por mes</h2>'
    + '<label class="muted" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="kComp" style="height:auto"' + (COMP_ON ? ' checked' : '') + '> ver por componente</label></div>'
    + '<div style="overflow:auto;margin-top:8px"><table' + (COMP_ON || conIng ? '' : ' style="max-width:520px"') + '>' + th
    + pm.map(function (x) {
        return '<tr><td>' + mesTxt(x.m) + '</td><td class="num"><b>' + num(x.e) + '</b></td>' + (conIng ? '<td class="num">' + num(x.i) + '</td><td class="num">' + num(x.e - x.i) + '</td>' : '')
          + (COMP_ON ? R.porComp.map(function (c) { return '<td class="num">' + num(x.comp[c.i] || 0) + '</td>'; }).join('') : '') + '</tr>'; }).join('')
    + '<tfoot><tr><td>Total</td><td class="num">' + num(R.total) + '</td>' + (conIng ? '<td class="num">' + num(R.totalIng) + '</td><td class="num">' + num(R.total - R.totalIng) + '</td>' : '')
    + (COMP_ON ? R.porComp.map(function (c) { return '<td class="num">' + num(c.e) + '</td>'; }).join('') : '') + '</tr></tfoot></table></div>'
    + '<p class="nota">Costo = egresos del grupo' + (conIng ? '; costo neto = costo − ingresos' : '; el grupo no tiene ingresos en el período') + '.</p></div>';
  // barras
  h += '<div class="card"><h2>Crecimiento mensual</h2>' + barrasSVG(pm.map(function (x) { return {m: x.m, v: x.e}; }))
    + '<p class="nota">Arriba de cada barra, la variación contra el mes anterior (es costo: <span style="color:var(--rojo)">▲ sube en rojo</span>, <span style="color:var(--verde)">▼ baja en verde</span>). Punteado: promedio del rango.</p></div>';
  // tortas
  var Tc = GCcalc.partTorta(R.porCta.map(function (c) { return {k: c.cuenta, label: c.nombre || c.cuenta, tip: c.cuenta + ' ' + c.nombre, v: c.e}; }), 8);
  var Tk = GCcalc.partTorta(R.porComp.map(function (c) { return {k: String(c.i), label: c.c.centro_nombre || c.c.centro, tip: c.c.empresa + ' ' + c.c.centro + ' ' + (c.c.centro_nombre || ''), v: c.e}; }), 8);
  var negC = R.porCta.filter(function (c) { return c.e < 0; }), negK = R.porComp.filter(function (c) { return c.e < 0; });
  var sCta = R.porCta.reduce(function (s, c) { return s + c.e; }, 0), sComp = R.porComp.reduce(function (s, c) { return s + c.e; }, 0);
  var totPub = R.completo ? R.total : null;
  h += '<div class="tortas2"><div class="card"><h2>Por cuenta contable</h2><div id="kTcta"></div>'
    + '<p class="nota">Σ ' + pesos(sCta) + (R.completo ? '' : ' · <b>período publicado completo</b> (' + mesTxt(R.todos[0]) + ' → ' + mesTxt(R.todos[R.todos.length - 1]) + '): el detalle por cuenta no se publica por mes, así que esta torta no sigue el rango elegido')
    + (negC.length ? ' · ' + negC.length + ' cuenta(s) con saldo a favor fuera de la torta (' + pesos(negC.reduce(function (s, c) { return s + c.e; }, 0)) + ')' : '') + '. Clic → «Costos · grupo» filtrado por esa cuenta.</p></div>'
    + '<div class="card"><h2>Por centro de costos</h2><div id="kTcen"></div>'
    + '<p class="nota">Σ ' + pesos(sComp) + ' (' + mesTxt(R.d) + ' → ' + mesTxt(R.h) + ')'
    + (negK.length ? ' · ' + negK.length + ' centro(s) con saldo a favor fuera de la torta (' + pesos(negK.reduce(function (s, c) { return s + c.e; }, 0)) + ')' : '') + '. Clic → «Costos · grupo» con ese centro.</p></div></div>';
  // definición del grupo
  var desc = function (c) {
    return esc(c.empresa) + ' ' + esc(c.centro) + ' ' + esc(c.centro_nombre || '')
      + ((c.cuentas || []).length ? ' (solo ' + esc(c.cuentas.join(', ')) + ')' : (c.cuentas_excluir || []).length ? ' (todas menos ' + esc(c.cuentas_excluir.join(', ')) + ')' : ' (todas las cuentas)');
  };
  h += '<div class="card"><p class="nota" style="margin:0"><b>Definición del grupo:</b> ' + comps.map(desc).join(' · ') + (g.nota ? '<br>' + esc(g.nota) : '')
    + '<br>' + lnk('ver todo el detalle → Costos · grupo', 'grupos', {g: g.id, d: R.d, h: R.h}) + '</p></div>';
  V.innerHTML = h;
  // controles: Σ tortas = total de la tabla
  var ok1 = Math.abs(sComp - R.total) < 0.5, ok2 = totPub == null || Math.abs(sCta - totPub) < 0.5, okG = !R.completo || g.total == null || Math.abs(Number(g.total) - R.total) < 0.5;
  console[ok1 && ok2 && okG ? 'info' : 'warn']('[gc] tablero de costos ' + g.id + ' ' + R.d + '→' + R.h + ': tabla ' + R.total.toFixed(2) + ' · Σ torta centros ' + sComp.toFixed(2)
    + ' · Σ torta cuentas ' + sCta.toFixed(2) + (R.completo ? ' · publicado ' + Number(g.total).toFixed(2) : ' (cuentas = período completo)') + (ok1 && ok2 && okG ? ' · OK' : ' · DIFERENCIA'));
  var aGrupo = function (extra) { ver('grupos', Object.assign({g: g.id}, extra)); };
  if (Tc.slices.length) pintarTorta($('kTcta'), Tc.slices, ['$ ' + millones(Tc.total), Tc.slices.length + ' porciones'], function (s) { aGrupo(s.k === '_otros' ? {} : {cta: s.k}); }, 640);
  else $('kTcta').innerHTML = '<div class="vacio">Sin datos por cuenta.</div>';
  if (Tk.slices.length) pintarTorta($('kTcen'), Tk.slices, ['$ ' + millones(Tk.total), R.ms.length + (R.ms.length === 1 ? ' mes' : ' meses')], function (s) { aGrupo(s.k === '_otros' ? {d: R.d, h: R.h} : {comp: Number(s.k), d: R.d, h: R.h}); }, 640);
  else $('kTcen').innerHTML = '<div class="vacio">Sin datos por centro en el rango.</div>';
  $('kSel').onchange = function () { ver('costos', {g: this.value}); };
  $('kD').onchange = $('kH').onchange = function () { ver('costos', {g: g.id, d: $('kD').value, h: $('kH').value}); };
  $('kComp').onchange = function () { COMP_ON = this.checked; LS.set('porcomp', COMP_ON ? '1' : '0'); ver('costos', {g: g.id, d: R.d, h: R.h}); };
  $('kCsv').onclick = function () {
    var f = [['Gestión y Costos · tablero de costos', g.nombre, 'versión ' + g.version, mesTxt(R.d) + ' a ' + mesTxt(R.h)],
      ['Datos de Physis al', fechaHora(g.datos_physis_al), 'Publicado el', fechaHora(g.publicado_el)], [],
      ['Mes', 'Costo'].concat(conIng ? ['Ingresos', 'Costo neto'] : []).concat(R.porComp.map(function (c) { return c.c.centro + ' ' + (c.c.centro_nombre || ''); }))];
    pm.forEach(function (x) { f.push([mesTxt(x.m), x.e].concat(conIng ? [x.i, x.e - x.i] : []).concat(R.porComp.map(function (c) { return x.comp[c.i] || 0; }))); });
    f.push(['Total', R.total].concat(conIng ? [R.totalIng, R.total - R.totalIng] : []).concat(R.porComp.map(function (c) { return c.e; })));
    f.push([]); f.push(['Cuenta', 'Nombre', 'Egresos (período publicado completo)', '% del total']);
    R.porCta.slice().sort(function (a, b) { return b.e - a.e; }).forEach(function (c) { f.push([c.cuenta, c.nombre, c.e, sCta ? Math.round(c.e / sCta * 1000) / 10 : '']); });
    csv('costos_' + g.id + '_' + R.d + '_' + R.h + '.csv', f);
  };
}

arrancar().catch(function () { $('sinRed').classList.remove('oculto'); });
