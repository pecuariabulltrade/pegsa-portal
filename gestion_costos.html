<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión y Costos · PEGSA</title>
<!--
  v15.88 · Gestión y Costos (PORTAL_COSTOS_20, Nicolás 14/10/2026)
  ─────────────────────────────────────────────────────────────────
  Página propia como compras.html / analisis_costos.html. Lee los cierres de
  gestión y los grupos de costos que publica el PORTAL DE COSTOS local (botón
  «Publicar») en el proyecto Supabase DEDICADO «gestion» (tablas gc_*).

  ⚠ ESTE ARCHIVO NO TIENE NINGÚN NÚMERO. El repo es GitHub Pages: todo lo que
  esté acá lo lee cualquiera con la URL. Los números viven en Supabase con RLS:
  la clave de abajo es la PUBLICABLE (anon, pública por diseño) y sin sesión
  no lee nada (probado: 0 filas). La sesión es la de Supabase Auth del
  proyecto «gestion» (usuarios que crea Nicolás), distinta de la de Hotelería.
  La clave service_role NUNCA va acá: queda en el .env del portal de costos.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* Mismos tokens que compras.html / analisis_costos.html */
  :root{
    --bg:#faf8f4; --surface:#FFF; --surface-2:#f7f5f0;
    --border:#e3e1da; --border-2:#d8d6ce;
    --ink:#1a1612; --text-2:#4a453f; --mutedc:#8a827a;
    --accent:#b8922a; --accent-bright:#d4a84b; --accent-soft:#faf6ea;
    --verde:#27613d; --verde-soft:#eef5f0;
    --ambar:#b8922a; --ambar-soft:#fdf6e3;
    --rojo:#c0392b; --rojo-soft:#fbebe8;
    --azul:#2d6a8a; --azul-soft:#eef4f7;
    --navy:#0F1B64;
    --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans)}
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);
    padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  header h1{font-family:var(--serif);font-weight:700;font-size:20px;margin:0}
  header a.volver{font-family:var(--mono);font-size:11px;color:var(--mutedc);text-decoration:none}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{all:unset;font-family:var(--mono);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;
    padding:6px 11px;border-radius:6px;cursor:pointer;color:var(--text-2)}
  nav button.on{background:var(--accent);color:#fff}
  .sesion{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mutedc);display:flex;align-items:center;gap:8px}
  main{max-width:1400px;margin:0 auto;padding:18px 24px 60px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}
  .card h2{font-family:var(--serif);font-weight:700;font-size:17px;margin:0 0 6px}
  .muted{color:var(--mutedc);font-size:12.5px}
  .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mutedc);margin-bottom:3px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent)}
  .kpis{display:flex;flex-wrap:wrap;gap:22px;margin:8px 0}
  .kpi .v{font-size:22px;font-weight:700;font-family:var(--serif)}
  .kpi .v.grande{font-size:30px}
  .kpi .d{font-family:var(--mono);font-size:11px;color:var(--mutedc)}
  .neg{color:var(--rojo)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mutedc);font-weight:600;
    text-align:left;padding:6px 8px;border-bottom:1px solid var(--border-2);background:var(--surface)}
  td{padding:5px 8px;border-bottom:1px solid var(--border)}
  .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.ram td{background:var(--surface-2);font-weight:700}
  tr.sub td{font-weight:600}
  tr.cen{cursor:pointer} tr.cen:hover td{background:var(--accent-soft)}
  tr.cta td{font-size:11.5px;color:var(--text-2)}
  tfoot td{font-weight:700;border-top:2px solid var(--border-2);background:var(--surface-2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
  .emp-card .flecha{font-size:14px}
  button.btn{height:32px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:#fff;
    padding:0 14px;font-family:var(--mono);font-size:11.5px;cursor:pointer}
  button.btn.sec{background:var(--surface);color:var(--text-2);border-color:var(--border-2)}
  select,input{height:32px;border:1px solid var(--border-2);border-radius:7px;padding:0 8px;font:400 13px var(--sans);background:var(--surface)}
  .aviso{background:var(--ambar-soft);border:1px solid #e8d9ad;color:#7a5c12;border-radius:8px;padding:8px 12px;font-size:12.5px;margin:0 0 12px}
  .aviso.err{background:var(--rojo-soft);border-color:#e8c4bd;color:var(--rojo)}
  .seg{display:inline-flex;border:1px solid var(--border-2);border-radius:7px;overflow:hidden;height:28px}
  .seg button{all:unset;padding:0 9px;display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--text-2)}
  .seg button.on{background:var(--accent);color:#fff}
  #login{max-width:380px;margin:80px auto}
  #login .card{padding:26px}
  #login input{width:100%;margin:4px 0 12px}
  .oculto{display:none}
  .scroll{overflow:auto;max-height:620px}
</style>
</head>
<body>
<header>
  <h1>Gestión y Costos</h1>
  <a class="volver" href="index.html">← Portal</a>
  <nav id="nav" class="oculto">
    <button data-v="tablero" class="on">Tablero</button>
    <button data-v="cierre">Un cierre</button>
    <button data-v="comparar">Comparar</button>
    <button data-v="grupos">Costos · grupos</button>
  </nav>
  <div class="sesion" id="sesion"></div>
</header>

<main>
  <!-- LOGIN: sin sesión no se pide ningún dato -->
  <div id="login" class="oculto">
    <div class="card">
      <h2>Acceso restringido</h2>
      <p class="muted" style="margin-top:0">Resultados de gestión y costos. Ingresá con tu usuario de
        <b>Gestión</b> (Supabase · proyecto «gestion»; no es el de Hotelería ni el del portal).</p>
      <div class="lbl">Email</div><input id="lEmail" type="email" autocomplete="username">
      <div class="lbl">Contraseña</div><input id="lPass" type="password" autocomplete="current-password">
      <div id="lErr" class="aviso err oculto"></div>
      <button class="btn" id="lBtn" style="width:100%">Ingresar</button>
    </div>
  </div>
  <div id="sinRed" class="card oculto"><h2>Sin conexión</h2>
    <p class="muted">No se pudo conectar con el servidor de datos. Revisá la conexión y recargá.</p></div>

  <div id="app" class="oculto">
    <section id="v-tablero"></section>
    <section id="v-cierre" class="oculto"></section>
    <section id="v-comparar" class="oculto"></section>
    <section id="v-grupos" class="oculto"></section>
  </div>
</main>

<script>
/* ── configuración: SOLO la clave publicable (anon) del proyecto «gestion» ── */
var GC_CFG = {
  url:  'https://lahflesddeazgezatcct.supabase.co',
  anon: 'sb_publishable_30z-8e1wLarzjIktPk3JRw_SWra2qAb'
};
var GC = { sb: null, user: null, empresas: [], cierres: [], cache: {} };

/* ── formato es-AR ── */
function pesos(n, dec) {
  if (n == null || isNaN(n)) return '—';
  return '$ ' + Number(n).toLocaleString('es-AR', {minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0});
}
function num(n) { return n == null ? '—' : Number(n).toLocaleString('es-AR', {maximumFractionDigits: 0}); }
function pct(n) { return n == null ? '' : Number(n).toLocaleString('es-AR', {maximumFractionDigits: 1}) + ' %'; }
function fecha(s) { if (!s) return '—'; var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : s; }
function fechaHora(s) {
  if (!s) return '—';
  try { var d = new Date(s); return d.toLocaleDateString('es-AR', {day: '2-digit', month: '2-digit', year: 'numeric'}) + ' ' + d.toLocaleTimeString('es-AR', {hour: '2-digit', minute: '2-digit'}); }
  catch (e) { return s; }
}
function mesTxt(m) { if (!m || m === 'dif_stock') return m === 'dif_stock' ? 'Dif. stock' : '—'; return m.slice(5, 7) + '/' + m.slice(0, 4); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function cls(n) { return Number(n) < 0 ? ' neg' : ''; }
function $(id) { return document.getElementById(id); }

/* ── acceso a datos: TODO pasa por acá (sesión + RLS) ── */
GC.leer = async function (tabla, filtros, orden) {
  var k = tabla + JSON.stringify(filtros || {}) + (orden || '');
  if (GC.cache[k]) return GC.cache[k];
  var out = [], desde = 0, paso = 1000;
  while (true) {
    var q = GC.sb.from(tabla).select('*');
    Object.keys(filtros || {}).forEach(function (c) { q = q.eq(c, filtros[c]); });
    if (orden) orden.split(',').forEach(function (o) { q = q.order(o.trim()); });
    var r = await q.range(desde, desde + paso - 1);
    if (r.error) throw r.error;
    out = out.concat(r.data || []);
    if (!r.data || r.data.length < paso) break;
    desde += paso;
  }
  GC.cache[k] = out;
  return out;
};

/* ── sesión ── */
async function arrancar() {
  if (!window.supabase) { $('sinRed').classList.remove('oculto'); return; }
  GC.sb = window.supabase.createClient(GC_CFG.url, GC_CFG.anon, {auth: {persistSession: true, storageKey: 'pegsa-gestion-auth'}});
  var s = await GC.sb.auth.getSession();
  if (s.data && s.data.session) return GC.iniciar(s.data.session.user);
  mostrarLogin();
}
function mostrarLogin(msg) {
  $('app').classList.add('oculto'); $('nav').classList.add('oculto'); $('sesion').innerHTML = '';
  $('login').classList.remove('oculto');
  if (msg) { $('lErr').textContent = msg; $('lErr').classList.remove('oculto'); }
}
$('lBtn').onclick = async function () {
  $('lErr').classList.add('oculto');
  var r = await GC.sb.auth.signInWithPassword({email: $('lEmail').value.trim(), password: $('lPass').value});
  if (r.error) return mostrarLogin(r.error.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos.' : r.error.message);
  $('lPass').value = '';
  GC.iniciar(r.data.user);
};
$('lPass').onkeydown = function (e) { if (e.key === 'Enter') $('lBtn').click(); };
async function salir() { await GC.sb.auth.signOut(); GC.cache = {}; location.reload(); }

GC.iniciar = async function (user) {
  GC.user = user;
  $('login').classList.add('oculto');
  $('sesion').innerHTML = esc(user.email || '') + ' · <a href="#" onclick="salir();return false">salir</a>';
  try {
    GC.empresas = await GC.leer('gc_empresas', {}, 'orden');
    GC.cierres = await GC.leer('gc_cierres', {vigente: true}, 'empresa_id,mes');
  } catch (e) {
    return mostrarLogin('No se pudieron leer los datos: ' + (e.message || e));
  }
  $('nav').classList.remove('oculto'); $('app').classList.remove('oculto');
  ver('tablero');
};
document.querySelectorAll('#nav button').forEach(function (b) { b.onclick = function () { ver(b.dataset.v); }; });
function ver(v, arg) {
  document.querySelectorAll('#nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); });
  ['tablero', 'cierre', 'comparar', 'grupos'].forEach(function (x) { $('v-' + x).classList.toggle('oculto', x !== v); });
  ({tablero: vTablero, cierre: vCierre, comparar: vComparar, grupos: vGrupos})[v](arg);
  window.scrollTo(0, 0);
}
function cierresDe(eid) { return GC.cierres.filter(function (c) { return c.empresa_id === eid; }).sort(function (a, b) { return a.mes < b.mes ? -1 : 1; }); }
function nomEmp(eid) { var e = GC.empresas.filter(function (x) { return x.id === eid; })[0]; return e ? e.nombre : eid; }

/* ══════════ 1 · tablero ══════════ */
var SERIE = 'final', CHARTS = [];
function vTablero() {
  CHARTS.forEach(function (c) { c.destroy(); }); CHARTS = [];
  var h = '<div class="card"><h2>Gestión · tablero</h2><p class="muted" style="margin:0">Cada cierre es la gestión '
    + '<b>anualizada</b>: los 12 meses terminados en el mes cerrado. El número grande es el <b>resultado final</b> '
    + '(s/ tenencia + tenencia), como en el portal de costos. Serie del gráfico: <span class="seg" id="segSerie">'
    + '<button data-s="final">final</button><button data-s="sin_tenencia">s/ tenencia</button><button data-s="operativo">operativo</button></span></p></div>'
    + '<div class="grid">';
  GC.empresas.forEach(function (e) {
    var cs = cierresDe(e.id), u = cs[cs.length - 1], p = cs[cs.length - 2];
    h += '<div class="card emp-card"><h2>' + esc(e.nombre) + ' <span class="pill">' + esc(e.grupo) + '</span></h2>';
    if (!u) { h += '<div class="muted">Sin cierres publicados.</div></div>'; return; }
    var dif = p ? u.final - p.final : null, base = p ? Math.abs(p.final) : null;
    h += '<div class="muted">cierre <a href="#" onclick="ver(\'cierre\',{e:\'' + e.id + '\',m:\'' + u.mes + '\'});return false">' + mesTxt(u.mes) + '</a> · ventana '
      + fecha(u.desde) + ' → ' + fecha(u.hasta) + ' · versión ' + u.version + '</div>'
      + '<div class="kpi"><div class="v grande' + cls(u.final) + '">' + pesos(u.final) + '</div>'
      + '<div class="d">s/ tenencia ' + pesos(u.sin_tenencia) + ' · tenencia ' + pesos(u.tenencia) + '</div></div>';
    if (dif != null) h += '<div class="flecha" style="color:' + (dif >= 0 ? 'var(--verde)' : 'var(--rojo)') + '">'
      + (dif > 0 ? '▲' : dif < 0 ? '▼' : '=') + ' ' + pesos(Math.abs(dif)) + (base ? ' (' + pct(dif / base * 100) + ')' : '')
      + ' <span class="muted">contra ' + mesTxt(p.mes) + ' · <a href="#" onclick="ver(\'comparar\',{e:\'' + e.id + '\',a:\'' + p.mes + '\',b:\'' + u.mes + '\'});return false">qué lo explica</a></span></div>';
    else h += '<div class="muted">primer cierre publicado</div>';
    h += '<div style="height:170px;margin-top:8px"><canvas id="ch_' + e.id + '"></canvas></div></div>';
  });
  h += '</div><div class="card" style="overflow:auto"><h2>Cierres publicados</h2><table><tr><th>Empresa</th><th>Cierre</th><th>Ventana</th>'
    + '<th class="num">Ingresos</th><th class="num">Egresos</th><th class="num">Operativo</th><th class="num">Dif. stock</th>'
    + '<th class="num">S/ tenencia</th><th class="num">Tenencia</th><th class="num">Final</th><th>Datos de Physis al</th><th>Publicado el</th><th>Versión</th></tr>';
  GC.empresas.forEach(function (e) {
    cierresDe(e.id).slice().reverse().forEach(function (c) {
      h += '<tr><td>' + esc(e.nombre) + '</td><td><a href="#" onclick="ver(\'cierre\',{e:\'' + e.id + '\',m:\'' + c.mes + '\'});return false">' + mesTxt(c.mes) + '</a></td>'
        + '<td class="muted">' + fecha(c.desde) + ' → ' + fecha(c.hasta) + '</td>'
        + ['ingresos', 'egresos', 'operativo', 'dif_stock', 'sin_tenencia', 'tenencia', 'final'].map(function (k) {
            return '<td class="num' + cls(c[k]) + '">' + (k === 'final' ? '<b>' : '') + num(c[k]) + (k === 'final' ? '</b>' : '') + '</td>'; }).join('')
        + '<td class="muted">' + fechaHora(c.datos_physis_al) + '</td><td class="muted">' + fechaHora(c.publicado_el) + '</td><td>v' + c.version + '</td></tr>';
    });
  });
  $('v-tablero').innerHTML = h + '</table></div>';
  document.querySelectorAll('#segSerie button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.s === SERIE);
    b.onclick = function () { SERIE = b.dataset.s; vTablero(); };
  });
  if (!window.Chart) return;
  GC.empresas.forEach(function (e) {
    var cs = cierresDe(e.id), el = $('ch_' + e.id);
    if (!el || !cs.length) return;
    CHARTS.push(new Chart(el, {type: 'line', data: {labels: cs.map(function (c) { return mesTxt(c.mes); }),
      datasets: [{data: cs.map(function (c) { return c[SERIE]; }), borderColor: '#b8922a', backgroundColor: '#b8922a', tension: .2, pointRadius: 4}]},
      options: {maintainAspectRatio: false, plugins: {legend: {display: false}, tooltip: {callbacks: {label: function (x) { return pesos(x.parsed.y); }}}},
        scales: {y: {ticks: {callback: function (v) { return '$ ' + (v / 1e6).toLocaleString('es-AR', {maximumFractionDigits: 0}) + ' M'; }}}}}}));
  });
}

/* ══════════ 2 · un cierre ══════════ */
var ABIERTO = {};
function selectorCierre(eid, mes, onch) {
  var h = '<select id="selEmp">' + GC.empresas.map(function (e) { return '<option value="' + e.id + '"' + (e.id === eid ? ' selected' : '') + '>' + esc(e.nombre) + '</option>'; }).join('') + '</select> '
    + '<select id="selMes">' + cierresDe(eid).map(function (c) { return '<option' + (c.mes === mes ? ' selected' : '') + '>' + c.mes + '</option>'; }).join('') + '</select>';
  return h;
}
async function vCierre(arg) {
  var eid = (arg && arg.e) || (GC.empresas[0] || {}).id, cs = cierresDe(eid);
  var mes = (arg && arg.m) || (cs[cs.length - 1] || {}).mes, ver_ = arg && arg.v;
  var V = $('v-cierre');
  if (!mes) { V.innerHTML = '<div class="card muted">Sin cierres publicados.</div>'; return; }
  V.innerHTML = '<div class="card muted">cargando…</div>';
  var todas = await GC.leer('gc_cierres', {empresa_id: eid, mes: mes}, 'version');
  var c = ver_ ? todas.filter(function (x) { return x.version === ver_; })[0] : todas.filter(function (x) { return x.vigente; })[0];
  var k = {empresa_id: eid, mes: mes, version: c.version};
  var cen = await GC.leer('gc_cierre_centros', k), cta = await GC.leer('gc_cierre_cuentas', k), mm = await GC.leer('gc_cierre_meses', k);
  GC.actual = {c: c, cen: cen, cta: cta, mm: mm};
  var tj = [['Ingresos', 'ingresos'], ['Egresos', 'egresos'], ['Resultado operativo', 'operativo'], ['Dif. de stock', 'dif_stock'],
            ['Resultado s/ tenencia', 'sin_tenencia'], ['Tenencia', 'tenencia'], ['Resultado final', 'final']];
  var h = '<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' + selectorCierre(eid, mes)
    + ' <button class="btn sec" onclick="csvCierre()">Descargar Excel (CSV)</button></div>'
    + '<h2 style="margin-top:10px">' + esc(nomEmp(eid)) + ' · cierre ' + mesTxt(mes) + ' <span class="pill">' + fecha(c.desde) + ' → ' + fecha(c.hasta) + '</span> '
    + '<span class="pill">versión ' + c.version + (c.vigente ? '' : ' (anterior)') + '</span></h2>'
    + '<div class="muted">Datos de Physis al ' + fechaHora(c.datos_physis_al) + ' · Publicado el ' + fechaHora(c.publicado_el) + '</div><div class="kpis">';
  tj.forEach(function (t) {
    var sub = '';
    if (t[1] === 'dif_stock' && c.dif_stock_insumos != null) sub = 'hacienda ' + pesos(c.dif_stock_hacienda) + ' · insumos ' + pesos(c.dif_stock_insumos);
    if (t[1] === 'tenencia' && c.tenencia_insumos != null) sub = 'hacienda ' + pesos(c.tenencia_hacienda) + ' · insumos ' + pesos(c.tenencia_insumos);
    h += '<div class="kpi"><div class="lbl">' + t[0] + '</div><div class="v' + (t[1] === 'final' ? ' grande' : '') + cls(c[t[1]]) + '">' + pesos(c[t[1]]) + '</div>'
      + (sub ? '<div class="d">' + sub + '</div>' : '') + '</div>';
  });
  h += '</div>';
  (c.avisos || []).forEach(function (a) {
    if (a.tipo === 'facturas_internas_desbalanceadas') h += '<div class="aviso">Facturas internas desbalanceadas en la ventana: ' + a.n + ' (neto ' + pesos(a.neto) + '), como en el portal de costos.</div>';
    else if (a.texto) h += '<div class="aviso">' + esc(a.texto) + '</div>';
  });
  if (todas.length > 1) {
    h += '<div class="muted">Versiones: ' + todas.slice().reverse().map(function (x, i, arr) {
      var prev = arr[i + 1];
      return '<a href="#" onclick="ver(\'cierre\',{e:\'' + eid + '\',m:\'' + mes + '\',v:' + x.version + '});return false">v' + x.version + '</a>'
        + (x.vigente ? ' (vigente)' : '') + ' ' + fechaHora(x.publicado_el) + ' · final ' + pesos(x.final) + (prev ? ' · Δ ' + pesos(x.final - prev.final) : '');
    }).join(' · ') + '</div>';
  }
  h += '</div><div class="card"><div class="seg" id="segCierre"><button data-t="cen" class="on">Por centro de costo</button><button data-t="mes">Por mes</button></div>'
    + '<div id="tabCen" style="margin-top:10px">' + tablaCentros(c, cen) + '</div><div id="tabMes" class="oculto scroll" style="margin-top:10px">' + tablaMeses(c, cen, mm) + '</div></div>';
  V.innerHTML = h;
  $('selEmp').onchange = function () { ver('cierre', {e: this.value}); };
  $('selMes').onchange = function () { ver('cierre', {e: eid, m: this.value}); };
  document.querySelectorAll('#segCierre button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('#segCierre button').forEach(function (x) { x.classList.toggle('on', x === b); });
      $('tabCen').classList.toggle('oculto', b.dataset.t !== 'cen'); $('tabMes').classList.toggle('oculto', b.dataset.t !== 'mes');
    };
  });
}
function arbolCentros(cen) {
  var ram = {};
  cen.forEach(function (x) {
    var r = ram[x.ramal] = ram[x.ramal] || {cod: x.ramal, nombre: x.ramal_nombre, subs: {}, ingresos: 0, egresos: 0, resultado: 0};
    var s = r.subs[x.subramal] = r.subs[x.subramal] || {cod: x.subramal, nombre: x.subramal_nombre, centros: [], ingresos: 0, egresos: 0, resultado: 0};
    s.centros.push(x);
    ['ingresos', 'egresos', 'resultado'].forEach(function (k) { r[k] += Number(x[k]); s[k] += Number(x[k]); });
  });
  var abs = function (a, b) { return Math.abs(b.resultado) - Math.abs(a.resultado); };
  return Object.keys(ram).map(function (k) { var r = ram[k]; r.subs = Object.keys(r.subs).map(function (j) { var s = r.subs[j]; s.centros.sort(abs); return s; }).sort(abs); return r; }).sort(abs);
}
function tablaCentros(c, cen) {
  var den = c.sin_tenencia || 0, h = '<table><tr><th>Ramal / sub-ramal / centro</th><th>Empresa</th><th class="num">Ingresos</th><th class="num">Egresos</th><th class="num">Resultado</th><th class="num">% del resultado</th></tr>';
  arbolCentros(cen).forEach(function (r) {
    var kr = 'r' + r.cod, ab = ABIERTO[kr] !== false;
    h += '<tr class="ram" style="cursor:pointer" onclick="ABIERTO[\'' + kr + '\']=' + !ab + ';refrescarCen()"><td>' + (ab ? '▾ ' : '▸ ') + esc(r.cod) + ' ' + esc(r.nombre) + '</td><td></td>'
      + '<td class="num">' + num(r.ingresos) + '</td><td class="num">' + num(r.egresos) + '</td><td class="num' + cls(r.resultado) + '">' + num(r.resultado) + '</td>'
      + '<td class="num">' + (den ? pct(r.resultado / den * 100) : '') + '</td></tr>';
    if (!ab) return;
    r.subs.forEach(function (s) {
      h += '<tr class="sub"><td style="padding-left:22px">' + esc(s.cod) + ' ' + esc(s.nombre) + '</td><td></td><td class="num">' + num(s.ingresos) + '</td><td class="num">' + num(s.egresos)
        + '</td><td class="num' + cls(s.resultado) + '">' + num(s.resultado) + '</td><td></td></tr>';
      s.centros.forEach(function (x) {
        var kc = x.emp + '|' + x.centro;
        h += '<tr class="cen" onclick="abrirCentro(\'' + kc + '\')"><td style="padding-left:42px">' + (ABIERTO[kc] ? '▾ ' : '▸ ') + esc(x.centro === '~' ? '(sin centro)' : x.centro) + ' ' + esc(x.centro_nombre)
          + '</td><td class="muted">' + esc(x.emp) + '</td><td class="num">' + num(x.ingresos) + '</td><td class="num">' + num(x.egresos) + '</td><td class="num' + cls(x.resultado) + '"><b>' + num(x.resultado) + '</b></td>'
          + '<td class="num">' + (x.pct != null ? pct(x.pct) : '') + '</td></tr>';
        if (ABIERTO[kc]) {
          GC.actual.cta.filter(function (q) { return q.emp === x.emp && q.centro === x.centro; })
            .sort(function (a, b) { return Math.abs(b.resultado) - Math.abs(a.resultado); }).forEach(function (q) {
              h += '<tr class="cta"><td style="padding-left:62px">' + esc(q.cuenta) + ' ' + esc(q.cuenta_nombre) + '</td><td class="muted">' + esc(q.origen_mov)
                + '</td><td class="num">' + num(q.ingresos) + '</td><td class="num">' + num(q.egresos) + '</td><td class="num' + cls(q.resultado) + '">' + num(q.resultado) + '</td><td class="num muted">' + q.n + ' mov</td></tr>';
            });
        }
      });
    });
  });
  var tot = cen.reduce(function (a, x) { return a + Number(x.resultado); }, 0);
  return h + '<tfoot><tr><td>TOTAL = Resultado s/ tenencia</td><td></td><td class="num">' + num(c.ingresos) + '</td><td class="num">' + num(c.egresos)
    + '</td><td class="num">' + num(tot) + '</td><td></td></tr></tfoot></table>'
    + '<p class="muted">La tenencia (' + pesos(c.tenencia) + ') es la revaluación del stock entero y no se abre por centro: resultado final = s/ tenencia + tenencia.</p>';
}
function refrescarCen() { $('tabCen').innerHTML = tablaCentros(GC.actual.c, GC.actual.cen); }
function abrirCentro(k) { ABIERTO[k] = !ABIERTO[k]; refrescarCen(); }
function tablaMeses(c, cen, mm) {
  var meses = Array.from(new Set(mm.map(function (x) { return x.mes_op; }))).sort(function (a, b) { return (a === 'dif_stock') - (b === 'dif_stock') || (a < b ? -1 : 1); });
  var idx = {};
  mm.forEach(function (x) { idx[x.emp + '|' + x.centro + '|' + x.mes_op] = Number(x.resultado); });
  var h = '<table><tr><th>Centro</th>' + meses.map(function (m) { return '<th class="num">' + mesTxt(m) + '</th>'; }).join('') + '<th class="num">Total</th></tr>';
  cen.slice().sort(function (a, b) { return a.centro < b.centro ? -1 : 1; }).forEach(function (x) {
    h += '<tr><td>' + esc(x.centro) + ' ' + esc((x.centro_nombre || '').slice(0, 28)) + ' <span class="muted">' + esc(x.emp) + '</span></td>'
      + meses.map(function (m) { var v = idx[x.emp + '|' + x.centro + '|' + m]; return '<td class="num' + cls(v) + '">' + (v ? num(v) : '') + '</td>'; }).join('')
      + '<td class="num"><b>' + num(x.resultado) + '</b></td></tr>';
  });
  return h + '<tfoot><tr><td>Total</td>' + meses.map(function (m) {
    return '<td class="num">' + num(mm.filter(function (x) { return x.mes_op === m; }).reduce(function (a, x) { return a + Number(x.resultado); }, 0)) + '</td>'; }).join('')
    + '<td class="num">' + num(mm.reduce(function (a, x) { return a + Number(x.resultado); }, 0)) + '</td></tr></tfoot></table>';
}
function csv(nombre, filas) {
  var txt = filas.map(function (f) {
    return f.map(function (v) {
      if (typeof v === 'number') return String(v).replace('.', ',');
      var s = String(v == null ? '' : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(';');
  }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + txt], {type: 'text/csv;charset=utf-8'}));
  a.download = nombre; a.click();
}
function csvCierre() {
  var A = GC.actual, c = A.c, f = [['Gestión y Costos', nomEmp(c.empresa_id), 'cierre ' + c.mes, 'versión ' + c.version, 'ventana ' + c.desde + ' a ' + c.hasta],
    ['Datos de Physis al', fechaHora(c.datos_physis_al), 'Publicado el', fechaHora(c.publicado_el)], [],
    ['Ingresos', 'Egresos', 'Operativo', 'Dif. de stock', 'S/ tenencia', 'Tenencia', 'Final'],
    [c.ingresos, c.egresos, c.operativo, c.dif_stock, c.sin_tenencia, c.tenencia, c.final].map(Number), [],
    ['Empresa', 'Ramal', 'Sub-ramal', 'Centro', 'Nombre', 'Cuenta', 'Nombre cuenta', 'Origen', 'Ingresos', 'Egresos', 'Resultado', 'Filas']];
  A.cta.forEach(function (q) {
    var x = A.cen.filter(function (y) { return y.emp === q.emp && y.centro === q.centro; })[0] || {};
    f.push([q.emp, x.ramal_nombre, x.subramal_nombre, q.centro, x.centro_nombre, q.cuenta, q.cuenta_nombre, q.origen_mov, Number(q.ingresos), Number(q.egresos), Number(q.resultado), q.n]);
  });
  f.push([]); f.push(['Mes', 'Empresa', 'Centro', 'Ingresos', 'Egresos', 'Resultado']);
  A.mm.forEach(function (x) { f.push([x.mes_op, x.emp, x.centro, Number(x.ingresos), Number(x.egresos), Number(x.resultado)]); });
  csv('gestion_' + c.empresa_id + '_' + c.mes + '_v' + c.version + '.csv', f);
}

/* ══════════ 3 · comparar ══════════ */
async function vComparar(arg) {
  var eid = (arg && arg.e) || (GC.empresas[0] || {}).id, cs = cierresDe(eid);
  var b = (arg && arg.b) || (cs[cs.length - 1] || {}).mes, a = (arg && arg.a) || (cs[cs.length - 2] || {}).mes;
  var V = $('v-comparar');
  var sel = function (id, v) { return '<select id="' + id + '">' + cs.map(function (c) { return '<option' + (c.mes === v ? ' selected' : '') + '>' + c.mes + '</option>'; }).join('') + '</select>'; };
  var h = '<div class="card"><h2>Comparar dos cierres</h2><div style="display:flex;gap:10px;align-items:center">'
    + '<select id="cEmp">' + GC.empresas.map(function (e) { return '<option value="' + e.id + '"' + (e.id === eid ? ' selected' : '') + '>' + esc(e.nombre) + '</option>'; }).join('') + '</select>'
    + ' A ' + sel('cA', a) + ' B ' + sel('cB', b) + '</div></div>';
  if (!a || !b) { V.innerHTML = h + '<div class="card muted">Hacen falta dos cierres publicados.</div>'; return wireComp(eid); }
  var CA = cs.filter(function (c) { return c.mes === a; })[0], CB = cs.filter(function (c) { return c.mes === b; })[0];
  var ka = await GC.leer('gc_cierre_centros', {empresa_id: eid, mes: a, version: CA.version});
  var kb = await GC.leer('gc_cierre_centros', {empresa_id: eid, mes: b, version: CB.version});
  var m = {};
  ka.forEach(function (x) { m[x.emp + '|' + x.centro] = {x: x, a: Number(x.resultado), b: 0}; });
  kb.forEach(function (x) { var k = x.emp + '|' + x.centro; m[k] = m[k] || {x: x, a: 0, b: 0}; m[k].b = Number(x.resultado); m[k].x = x; });
  var filas = Object.keys(m).map(function (k) { var r = m[k]; r.d = r.b - r.a; return r; }).filter(function (r) { return r.a || r.b; })
    .sort(function (p, q) { return Math.abs(q.d) - Math.abs(p.d); });
  var sd = filas.reduce(function (s, r) { return s + r.d; }, 0);
  h += '<div class="card" style="overflow:auto"><p>Resultado final: <b>' + mesTxt(a) + '</b> ' + pesos(CA.final) + ' · <b>' + mesTxt(b) + '</b> ' + pesos(CB.final)
    + ' · diferencia <b>' + pesos(CB.final - CA.final) + '</b> = s/ tenencia ' + pesos(CB.sin_tenencia - CA.sin_tenencia) + ' (Σ por centro ' + pesos(sd) + ') + tenencia '
    + pesos(CB.tenencia - CA.tenencia) + '</p><table><tr><th>Centro</th><th>Empresa</th><th>Sub-ramal</th><th class="num">Resultado ' + mesTxt(a) + '</th><th class="num">Resultado ' + mesTxt(b) + '</th><th class="num">Diferencia</th></tr>'
    + filas.map(function (r) {
        return '<tr><td>' + esc(r.x.centro) + ' ' + esc(r.x.centro_nombre) + '</td><td class="muted">' + esc(r.x.emp) + '</td><td class="muted">' + esc(r.x.subramal_nombre)
          + '</td><td class="num' + cls(r.a) + '">' + num(r.a) + '</td><td class="num' + cls(r.b) + '">' + num(r.b) + '</td><td class="num' + cls(r.d) + '"><b>' + num(r.d) + '</b></td></tr>';
      }).join('') + '</table></div>';
  V.innerHTML = h;
  wireComp(eid);
}
function wireComp(eid) {
  $('cEmp').onchange = function () { ver('comparar', {e: this.value}); };
  if ($('cA')) $('cA').onchange = $('cB').onchange = function () { ver('comparar', {e: eid, a: $('cA').value, b: $('cB').value}); };
}

/* ══════════ 4 · costos · grupos ══════════ */
async function vGrupos(arg) {
  var V = $('v-grupos');
  var gs = await GC.leer('gc_grupos', {vigente: true}, 'nombre');
  if (!gs.length) { V.innerHTML = '<div class="card muted">No hay grupos publicados.</div>'; return; }
  var g = gs.filter(function (x) { return arg && x.id === arg.g; })[0] || gs[0];
  var meses = await GC.leer('gc_grupo_meses', {grupo_id: g.id, version: g.version}, 'mes_op');
  var ctas = await GC.leer('gc_grupo_cuentas', {grupo_id: g.id, version: g.version});
  var todos = Array.from(new Set(meses.map(function (x) { return x.mes_op; }))).sort();
  var d = (arg && arg.d) || todos[0], hh = (arg && arg.h) || todos[todos.length - 1];
  var ms = todos.filter(function (m) { return m >= d && m <= hh; });
  var comps = g.componentes || [];
  var E = {}, I = {};
  meses.forEach(function (x) { if (x.mes_op < d || x.mes_op > hh) return; E[x.mes_op + '|' + x.comp] = Number(x.egresos); I[x.comp] = (I[x.comp] || 0) + Number(x.ingresos); });
  var totC = comps.map(function (c, i) { return ms.reduce(function (s, m) { return s + (E[m + '|' + i] || 0); }, 0); });
  var tot = totC.reduce(function (a, b) { return a + b; }, 0);
  var porMes = ms.map(function (m) { return {m: m, t: comps.reduce(function (s, c, i) { return s + (E[m + '|' + i] || 0); }, 0)}; });
  var mx = porMes.slice().sort(function (a, b) { return b.t - a.t; })[0], mn = porMes.slice().sort(function (a, b) { return a.t - b.t; })[0];
  var desc = function (c) {
    return esc(c.empresa) + ' ' + esc(c.centro) + ' ' + esc(c.centro_nombre || '')
      + ((c.cuentas || []).length ? ' (solo ' + esc(c.cuentas.join(', ')) + ')' : (c.cuentas_excluir || []).length ? ' (todas menos ' + esc(c.cuentas_excluir.join(', ')) + ')' : ' (todas)');
  };
  var opt = function (id, v) { return '<select id="' + id + '">' + todos.map(function (m) { return '<option value="' + m + '"' + (m === v ? ' selected' : '') + '>' + mesTxt(m) + '</option>'; }).join('') + '</select>'; };
  var h = '<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><select id="gSel">'
    + gs.map(function (x) { return '<option value="' + x.id + '"' + (x.id === g.id ? ' selected' : '') + '>' + esc(x.nombre) + '</option>'; }).join('')
    + '</select> desde ' + opt('gD', d) + ' hasta ' + opt('gH', hh) + '</div>'
    + '<h2 style="margin-top:10px">' + esc(g.nombre) + ' <span class="pill">versión ' + g.version + '</span></h2>'
    + '<div class="muted">Publicado ' + fecha(g.periodo_desde) + ' → ' + fecha(g.periodo_hasta) + ' · Datos de Physis al ' + fechaHora(g.datos_physis_al) + ' · Publicado el ' + fechaHora(g.publicado_el) + '</div>'
    + (g.nota ? '<p class="muted">' + esc(g.nota) + '</p>' : '')
    + '<div style="font-size:12.5px;margin:6px 0"><b>Componentes:</b> ' + comps.map(desc).join(' · ') + '</div>'
    + '<div class="kpis"><div class="kpi"><div class="lbl">Total del período (costos)</div><div class="v grande">' + pesos(tot) + '</div></div>'
    + '<div class="kpi"><div class="lbl">Promedio mensual · ' + ms.length + ' meses</div><div class="v">' + pesos(ms.length ? tot / ms.length : 0) + '</div></div>'
    + (mx ? '<div class="kpi"><div class="lbl">Mes mayor</div><div class="v">' + mesTxt(mx.m) + ' · ' + pesos(mx.t) + '</div></div>' : '')
    + (mn ? '<div class="kpi"><div class="lbl">Mes menor</div><div class="v">' + mesTxt(mn.m) + ' · ' + pesos(mn.t) + '</div></div>' : '') + '</div>'
    + '<div>' + comps.map(function (c, i) { return '<span class="pill" style="margin:0 4px 4px 0">' + esc(c.centro) + ' ' + esc(c.centro_nombre || '') + ' · ' + (tot ? pct(totC[i] / tot * 100) : '') + '</span>'; }).join('') + '</div></div>'
    + '<div class="card" style="overflow:auto"><h2>Costos por mes</h2><table><tr><th>Mes</th>' + comps.map(function (c) { return '<th class="num">' + esc(c.centro) + ' ' + esc((c.centro_nombre || '').slice(0, 20)) + '</th>'; }).join('') + '<th class="num">Total</th></tr>'
    + porMes.map(function (p) { return '<tr><td>' + mesTxt(p.m) + '</td>' + comps.map(function (c, i) { return '<td class="num">' + num(E[p.m + '|' + i] || 0) + '</td>'; }).join('') + '<td class="num"><b>' + num(p.t) + '</b></td></tr>'; }).join('')
    + '<tfoot><tr><td>Total</td>' + totC.map(function (v) { return '<td class="num">' + num(v) + '</td>'; }).join('') + '<td class="num">' + num(tot) + '</td></tr></tfoot></table>'
    + (Object.keys(I).some(function (k) { return I[k]; }) ? '<p class="muted">Ingresos en el período: ' + comps.map(function (c, i) { return I[i] ? esc(c.centro) + ' ' + pesos(I[i]) : ''; }).filter(Boolean).join(' · ') + '</p>' : '')
    + '</div><div class="card" style="overflow:auto"><h2>Detalle por cuenta <span class="muted">(período publicado completo)</span></h2><table><tr><th>Componente</th><th>Cuenta</th><th>Origen</th><th class="num">Movs</th><th class="num">Egresos</th><th class="num">Ingresos</th></tr>'
    + ctas.slice().sort(function (a, b) { return a.comp - b.comp || b.egresos - a.egresos; }).map(function (q) {
        var c = comps[q.comp] || {};
        return '<tr><td>' + esc(c.centro || q.centro) + ' ' + esc((c.centro_nombre || '').slice(0, 22)) + '</td><td>' + esc(q.cuenta) + ' <span class="muted">' + esc(q.cuenta_nombre) + '</span></td><td class="muted">' + esc(q.origen_mov)
          + '</td><td class="num">' + q.n + '</td><td class="num">' + num(q.egresos) + '</td><td class="num">' + (Number(q.ingresos) ? num(q.ingresos) : '') + '</td></tr>';
      }).join('') + '</table></div>';
  V.innerHTML = h;
  $('gSel').onchange = function () { ver('grupos', {g: this.value}); };
  $('gD').onchange = $('gH').onchange = function () { ver('grupos', {g: g.id, d: $('gD').value, h: $('gH').value}); };
}

arrancar().catch(function () { $('sinRed').classList.remove('oculto'); });
</script>
